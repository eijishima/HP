<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドラム機材管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff;
  --bg2: #f5f5f5;
  --bg3: #eeeeee;
  --text: #1a1a1a;
  --text2: #666666;
  --text3: #999999;
  --border: rgba(0,0,0,0.12);
  --border2: rgba(0,0,0,0.22);
  --teal: #1D9E75;
  --teal-bg: #E1F5EE;
  --teal-text: #0F6E56;
  --blue-bg: #E6F1FB;
  --blue-text: #185FA5;
  --radius: 8px;
  --radius-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --bg2: #2c2c2e;
    --bg3: #3a3a3c;
    --text: #f2f2f7;
    --text2: #aeaeb2;
    --text3: #636366;
    --border: rgba(255,255,255,0.12);
    --border2: rgba(255,255,255,0.22);
    --teal-bg: #083d2e;
    --teal-text: #5DCAA5;
    --blue-bg: #0c2a4a;
    --blue-text: #85B7EB;
  }
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: var(--bg2); color: var(--text); min-height: 100vh; }
.app { max-width: 540px; margin: 0 auto; background: var(--bg); min-height: 100vh; }
.header { padding: 16px 16px 0; padding-top: max(16px, env(safe-area-inset-top)); }
.tab-bar { display: flex; border-bottom: 0.5px solid var(--border); margin: 0 -16px; padding: 0 16px; }
.tab { padding: 10px 16px; font-size: 14px; cursor: pointer; border: none; background: none; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }
.body { padding: 16px; padding-bottom: max(80px, calc(16px + env(safe-area-inset-bottom))); }
.section-label { font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 8px; overflow: hidden; }
.card-pad { padding: 12px 16px; }
.row { display: flex; align-items: center; gap: 8px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
input[type="text"], input[type="date"], input[type="number"], select {
  width: 100%; padding: 10px 12px; font-size: 15px; border: 0.5px solid var(--border2);
  border-radius: var(--radius); background: var(--bg); color: var(--text);
  outline: none; font-family: inherit;
}
input:focus, select:focus { border-color: var(--teal); }
input[type="number"] { width: 60px; text-align: center; }
button {
  padding: 9px 16px; font-size: 14px; border: 0.5px solid var(--border2);
  border-radius: var(--radius); background: var(--bg); color: var(--text);
  cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
}
button:active { opacity: 0.7; }
button.primary { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 500; }
.btn-icon { background: none; border: none; padding: 6px; color: var(--text2); cursor: pointer; border-radius: var(--radius); display: flex; align-items: center; }
.btn-icon:active { background: var(--bg3); }
.btn-icon.danger { color: #E24B4A; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.badge.base { background: var(--teal-bg); color: var(--teal-text); }
.badge.count { background: var(--blue-bg); color: var(--blue-text); }
.item-row { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 0.5px solid var(--border); }
.item-row:last-child { border-bottom: none; }
.item-row .name { flex: 1; font-size: 15px; }
.item-row .qty { font-size: 13px; color: var(--text2); }
.toggle-btn { font-size: 12px; padding: 4px 12px; border-radius: 20px; cursor: pointer; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text2); }
.toggle-btn.included { background: var(--teal-bg); border-color: var(--teal); color: var(--teal-text); }
.toggle-btn.excluded { color: var(--text3); text-decoration: line-through; }
.check-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 0.5px solid var(--border); cursor: pointer; }
.check-row:last-child { border-bottom: none; }
.check-row.checked .check-name { text-decoration: line-through; color: var(--text3); }
.check-name { flex: 1; font-size: 16px; }
.check-qty { font-size: 13px; color: var(--text2); }
input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: var(--teal); flex-shrink: 0; }
.progress-bar { height: 4px; background: var(--bg3); border-radius: 2px; }
.progress-fill { height: 4px; background: var(--teal); border-radius: 2px; transition: width 0.3s; }
.empty { text-align: center; color: var(--text3); font-size: 14px; padding: 3rem 0; }
.back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; color: var(--text2); font-size: 15px; padding: 8px 0; margin-bottom: 4px; font-family: inherit; }
.add-form { background: var(--bg2); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
.gig-card { cursor: pointer; }
.gig-meta { font-size: 13px; color: var(--text2); margin-top: 4px; }
.cat-label { font-size: 12px; font-weight: 500; color: var(--text3); padding: 10px 16px 6px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 0.5px solid var(--border); background: var(--bg2); }
.gig-type-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
[data-type="rehearsal"] > .card-pad, .gig-type-badge[data-type="rehearsal"] { background: #EDE9FE; }
.gig-type-badge[data-type="rehearsal"] { color: #5B21B6; }
[data-type="live"] > .card-pad, .gig-type-badge[data-type="live"], [data-type="rec"] > .card-pad, .gig-type-badge[data-type="rec"] { background: #FEE2E2; }
.gig-type-badge[data-type="live"], .gig-type-badge[data-type="rec"] { color: #991B1B; }
@media (prefers-color-scheme: dark) {
  [data-type="rehearsal"] > .card-pad { background: #2E1065; }
  .gig-type-badge[data-type="rehearsal"] { background: #2E1065; color: #C4B5FD; }
  [data-type="live"] > .card-pad, [data-type="rec"] > .card-pad { background: #450A0A; }
  .gig-type-badge[data-type="live"], .gig-type-badge[data-type="rec"] { background: #FEE2E2; color: #991B1B; }
}
.type-selected { border-color: var(--teal) !important; color: var(--teal) !important; background: var(--teal-bg) !important; }
.group-badge { background: var(--blue-bg); color: var(--blue-text); }
.group-badge.warn { background: #FEF3C7; color: #92400E; font-weight: 500; }
@media (prefers-color-scheme: dark) {
  .group-badge.warn { background: #451A03; color: #FCD34D; }
}
.month-header { font-size: 15px; font-weight: 600; color: var(--text); margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border2); }
.month-header:first-child { margin-top: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div id="app-title" class="row-between" style="padding:8px 0 12px">
      <span style="font-size:18px;font-weight:600">🥁 機材管理</span>
      <div class="row" style="gap:6px">
        <button class="btn-icon" id="export-btn" title="データを書き出す"><i class="ti ti-upload" style="font-size:19px"></i></button>
        <button id="import-btn" style="padding:6px 12px;font-size:13px">読み込む</button>
        <input type="file" id="import-file" accept=".json,application/json,text/plain" style="display:none">
      </div>
    </div>
    <div class="tab-bar" id="main-tabs">
      <button class="tab active" data-tab="gigs">現場</button>
      <button class="tab" data-tab="gear">機材</button>
      <button class="tab" data-tab="revenue">売上</button>
    </div>
  </div>
  <div class="body" id="root"></div>
</div>

<script>
let CATEGORIES = load('categories', ["ドラム本体","シンバル","ペダル","スタンド","スティック・ブラシ","その他"]);

function load(key, def) {
  try { return JSON.parse(localStorage.getItem('drumgear_' + key)) ?? def; } catch { return def; }
}
function save(key, val) { localStorage.setItem('drumgear_' + key, JSON.stringify(val)); }

let state = {
  view: 'gigs',
  activeGigId: null,
  gigView: 'list',
  showAddGig: false,
  showAddGear: false,
  showAddExtra: false,
  showAddCat: false,
  editingGig: false,
  editingGearId: null,
  showGearPicker: false,
  pickerCat: 'all',
  gigFilter: 'upcoming',
  gear: load('gear', [
    {id:1,name:'バスドラム',qty:1,cat:'ドラム本体',base:true},
    {id:2,name:'スネア',qty:1,cat:'ドラム本体',base:true},
    {id:3,name:'ハイハット',qty:1,cat:'シンバル',base:true},
    {id:4,name:'クラッシュシンバル',qty:2,cat:'シンバル',base:true},
    {id:5,name:'ライドシンバル',qty:1,cat:'シンバル',base:true},
    {id:6,name:'バスドラムペダル',qty:1,cat:'ペダル',base:true},
    {id:7,name:'ハイハットスタンド',qty:1,cat:'スタンド',base:true},
    {id:8,name:'スネアスタンド',qty:1,cat:'スタンド',base:true},
    {id:9,name:'シンバルスタンド',qty:3,cat:'スタンド',base:true},
    {id:10,name:'スティック',qty:2,cat:'スティック・ブラシ',base:true},
  ]),
  gigs: load('gigs', []),
  nextId: load('nextId', 100),
};

function setState(patch) { Object.assign(state, patch); render(); }
function saveAll() { save('gear', state.gear); save('gigs', state.gigs); save('nextId', state.nextId); save('categories', CATEGORIES); }
function newId() { state.nextId++; return state.nextId; }
function getGig(id) { return state.gigs.find(g => g.id === id); }

function groupBadge(allItems, item, checks) {
  if (!item.group) return '';
  const members = allItems.filter(i => !i.extra && i.group === item.group);
  const total = members.length;
  const done = checks ? members.filter(i => i.included && checks.includes(i.id)).length : members.filter(i => i.included).length;
  const complete = done >= total;
  return `<span class="badge group-badge ${complete?'':'warn'}"><i class="ti ti-link" style="font-size:11px;vertical-align:-1px;margin-right:2px"></i>${esc(item.group)} ${done}/${total}</span>`;
}

function gigItems(gig) {
  const base = state.gear.map(g => {
    const ov = (gig.overrides||[]).find(o => o.gearId === g.id);
    return { ...g, included: ov ? ov.included : g.base };
  });
  const extras = (gig.extras||[]).map(e => ({...e, included:true, extra:true}));
  return [...base, ...extras];
}

const GIG_TYPES = {rehearsal:{label:'リハーサル',bg:'#EDE9FE',text:'#5B21B6',darkBg:'#2E1065',darkText:'#C4B5FD'}, live:{label:'本番',bg:'#FEE2E2',text:'#991B1B',darkBg:'#450A0A',darkText:'#FCA5A5'}, rec:{label:'REC',bg:'#FEE2E2',text:'#991B1B',darkBg:'#450A0A',darkText:'#FCA5A5'}, other:{label:'その他',bg:'',text:''}};

function gigTypeBadge(type) {
  if (!type || type === 'other') return '';
  const t = GIG_TYPES[type];
  return `<span class="gig-type-badge" data-type="${type}">${t.label}</span>`;
}

function isAutoName(gig) {
  return GIG_TYPES[gig.type||'other'] && gig.name === GIG_TYPES[gig.type||'other'].label;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function carStatus(gig) {
  if (!gig.needsCar) return null;
  if (gig.carBooked) return 'booked';
  const d = daysUntil(gig.date);
  if (d === null) return 'pending';
  return d <= 14 ? 'urgent' : 'pending';
}

function carBadge(gig) {
  const status = carStatus(gig);
  if (!status) return '';
  if (status === 'booked') return `<span class="badge" style="background:var(--teal-bg);color:var(--teal-text)"><i class="ti ti-car" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>予約済み</span>`;
  if (status === 'urgent') return `<span class="badge" style="background:#FEE2E2;color:#991B1B"><i class="ti ti-alert-triangle" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>レンタカー予約可</span>`;
  return `<span class="badge" style="background:var(--bg3);color:var(--text2)"><i class="ti ti-car" style="font-size:12px;vertical-align:-1px;margin-right:3px"></i>レンタカー必要</span>`;
}

function knownArtists() {
  const set = new Set();
  state.gigs.forEach(g => { if (g.artist) set.add(g.artist); });
  return [...set];
}

function gigForm(gig) {
  const isEdit = !!gig;
  const g = gig || {};
  return `<div class="add-form" id="gig-form">
    <div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:4px">日程</div>
      <input type="date" id="gig-f-date" value="${g.date||''}">
    </div>
    <input type="text" id="gig-f-artist" placeholder="アーティスト名" value="${esc(g.artist||'')}" list="artist-suggestions">
    <datalist id="artist-suggestions">${knownArtists().map(a=>`<option value="${esc(a)}">`).join('')}</datalist>
    <input type="text" id="gig-f-name" placeholder="現場名" value="${esc(g.name||'')}">
    <input type="text" id="gig-f-venue" placeholder="場所" value="${esc(g.venue||'')}">
    <div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:4px">ギャラ（円）</div>
      <input type="number" id="gig-f-fee" placeholder="0" min="0" step="1" value="${g.fee||''}" style="width:100%;text-align:left">
    </div>
    <div class="row" style="gap:6px;flex-wrap:wrap">
      ${['rehearsal','live','rec','other'].map(t=>`<label style="flex:1;min-width:80px;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px;border:0.5px solid var(--border2);border-radius:var(--radius);cursor:pointer;font-size:13px" class="type-opt ${(g.type||'other')===t?'type-selected':''}">
        <input type="radio" name="gig-type" value="${t}" ${(g.type||'other')===t?'checked':''} style="width:14px;height:14px;accent-color:var(--teal)">
        ${GIG_TYPES[t].label}
      </label>`).join('')}
    </div>
    <label style="font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer">
      <input type="checkbox" id="gig-f-needscar" ${g.needsCar?'checked':''} style="width:18px;height:18px">レンタカーが必要
    </label>
    <div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:4px">メモ（セットリストなど）</div>
      <textarea id="gig-f-memo" rows="4" placeholder="セットリスト、注意事項など" style="width:100%;padding:10px 12px;font-size:15px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:inherit;resize:vertical">${esc(g.memo||'')}</textarea>
    </div>
    <div class="row" style="justify-content:flex-end;gap:8px">
      <button id="cancel-gig-form">キャンセル</button>
      <button class="primary" id="save-gig-form" data-edit-id="${g.id||''}">${isEdit?'保存':'作成'}</button>
    </div>
  </div>`;
}

function isGigCompleted(g) {
  if (!g.date) return false;
  return daysUntil(g.date) < 0;
}

function renderGigs() {
  let h = '';
  if (state.showAddGig) {
    h += gigForm(null);
  } else {
    h += `<div class="row-between" style="margin-bottom:12px">
      <span class="section-label" style="margin:0">現場一覧</span>
      <button class="btn-icon" id="add-gig-btn"><i class="ti ti-plus" style="font-size:22px"></i></button>
    </div>
    <div class="row" style="gap:6px;margin-bottom:12px">
      <button class="toggle-btn ${state.gigFilter!=='all'?'included':''}" data-gig-filter="upcoming">未完了</button>
      <button class="toggle-btn ${state.gigFilter==='all'?'included':''}" data-gig-filter="all">すべて表示</button>
    </div>`;
  }

  const visibleGigs = state.gigFilter === 'all' ? state.gigs : state.gigs.filter(g => !isGigCompleted(g));

  if (visibleGigs.length === 0 && !state.showAddGig) {
    h += `<div class="empty"><i class="ti ti-music" style="font-size:40px;display:block;margin-bottom:12px"></i>${state.gigs.length===0?'現場がまだありません<br><small>＋から追加してください</small>':'未完了の現場はありません'}</div>`;
  } else {
    let lastMonthKey = null;
    [...visibleGigs].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(g => {
      const monthKey = g.date ? g.date.slice(0,7) : 'none';
      if (monthKey !== lastMonthKey) {
        lastMonthKey = monthKey;
        const monthLabel = g.date ? new Date(g.date+'T00:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long'}) : '日程未定';
        h += `<div class="month-header">${monthLabel}</div>`;
      }
      const items = gigItems(g).filter(i=>i.included);
      const checks = (g.checks||[]).length;
      const pct = items.length > 0 ? Math.round(checks/items.length*100) : 0;
      const dateStr = g.date ? new Date(g.date+'T00:00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric'}) : '';
      h += `<div class="card gig-card" data-gig="${g.id}" data-type="${g.type||'other'}">
        <div class="card-pad">
          <div class="row-between">
            <span style="font-weight:700;font-size:18px">${dateStr || '日程未定'}</span>
            <div class="row" style="gap:4px;flex-shrink:0">
              <span class="badge count">${items.length}点</span>
              <button class="btn-icon danger" data-del-gig="${g.id}"><i class="ti ti-trash" style="font-size:17px"></i></button>
            </div>
          </div>
          <div class="row-between" style="margin-top:4px">
            ${g.artist?`<div style="font-size:15px;font-weight:500"><i class="ti ti-user" style="font-size:14px;vertical-align:-1px;margin-right:3px;color:var(--text2)"></i>${esc(g.artist)}</div>`:'<span></span>'}
            ${g.fee?`<span style="font-size:13px;color:var(--text2)">¥${g.fee.toLocaleString()}</span>`:''}
          </div>
          <div class="gig-meta" style="margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            ${gigTypeBadge(g.type)}
            ${!isAutoName(g) ? `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.name)}</span>` : ''}
            ${g.venue?`<span><i class="ti ti-map-pin" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i>${esc(g.venue)}</span>`:''}
          </div>
          ${g.needsCar?`<div style="margin-top:6px">${carBadge(g)}</div>`:''}
          <div class="progress-bar" style="margin-top:10px"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div style="font-size:12px;color:var(--text3);margin-top:5px">積み込み ${checks}/${items.length}点</div>
        </div>
      </div>`;
    });
  }
  return h;
}

function knownGroups() {
  const set = new Set();
  state.gear.forEach(g => { if (g.group) set.add(g.group); });
  return [...set];
}

function gearForm(gear) {
  const isEdit = !!gear;
  const g = gear || {};
  return `<div class="add-form">
    <input type="text" id="gear-f-name" placeholder="機材名" value="${esc(g.name||'')}">
    <div class="row" style="gap:8px">
      <input type="number" id="gear-f-qty" value="${g.qty||1}" min="1" max="99">
      <select id="gear-f-cat" style="flex:1">${CATEGORIES.map(c=>`<option ${g.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    <div>
      <input type="text" id="gear-f-group" placeholder="セット名（任意・例：フロアタム）" value="${esc(g.group||'')}" list="group-suggestions">
      <datalist id="group-suggestions">${knownGroups().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <div style="font-size:12px;color:var(--text3);margin-top:4px">同じセット名を付けると、両方揃うまで警告が出ます</div>
    </div>
    <label style="font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer">
      <input type="checkbox" id="gear-f-base" ${g.base!==false?'checked':''} style="width:18px;height:18px">ベースセットに含める
    </label>
    <div class="row" style="justify-content:flex-end;gap:8px">
      <button id="cancel-gear">キャンセル</button>
      <button class="primary" id="save-gear" data-edit-id="${g.id||''}">${isEdit?'保存':'追加'}</button>
    </div>
  </div>`;
}

function renderGear() {
  let h = '';
  if (state.showAddGear) {
    h += gearForm(state.editingGearId ? state.gear.find(g=>g.id===state.editingGearId) : null);
  } else {
    h += `<div class="row-between" style="margin-bottom:12px">
      <span class="section-label" style="margin:0">全機材リスト</span>
      <button class="btn-icon" id="add-gear-btn"><i class="ti ti-plus" style="font-size:22px"></i></button>
    </div>`;
  }

  h += `<div class="section-label" style="margin-top:20px;margin-bottom:8px">カテゴリ</div>
  <div class="card" style="margin-bottom:16px">`;
  CATEGORIES.forEach((cat, i) => {
    h += `<div class="item-row">
      <span class="name">${esc(cat)}</span>
      ${i > 0 ? `<button class="btn-icon" data-cat-up="${i}" title="上へ"><i class="ti ti-arrow-up" style="font-size:15px"></i></button>` : '<span style="width:27px"></span>'}
      ${i < CATEGORIES.length-1 ? `<button class="btn-icon" data-cat-down="${i}" title="下へ"><i class="ti ti-arrow-down" style="font-size:15px"></i></button>` : '<span style="width:27px"></span>'}
      <button class="btn-icon danger" data-del-cat="${i}"><i class="ti ti-trash" style="font-size:15px"></i></button>
    </div>`;
  });
  if (state.showAddCat) {
    h += `<div style="padding:10px 16px;border-top:0.5px solid var(--border)">
      <div class="row" style="gap:8px">
        <input type="text" id="new-cat-name" placeholder="カテゴリ名" style="flex:1">
        <button id="cancel-cat">キャンセル</button>
        <button class="primary" id="save-cat">追加</button>
      </div>
    </div>`;
  } else {
    h += `<div style="padding:8px 16px;border-top:0.5px solid var(--border)">
      <button id="add-cat-btn" style="border:none;padding:0;font-size:13px;color:var(--teal)"><i class="ti ti-plus" style="font-size:14px"></i> カテゴリを追加</button>
    </div>`;
  }
  h += `</div>`;

  h += `<div class="section-label" style="margin-bottom:8px">機材</div>`;
  const by = {};
  CATEGORIES.forEach(c => by[c] = []);
  state.gear.forEach(g => (by[g.cat]||by['その他']).push(g));

  CATEGORIES.forEach(cat => {
    if (!by[cat].length) return;
    h += `<div class="card" style="margin-bottom:10px">
      <div class="cat-label">${cat}</div>`;
    by[cat].forEach(g => {
      h += `<div class="item-row">
        <span class="name">${esc(g.name)}</span>
        <span class="qty">×${g.qty}</span>
        ${g.group?`<span class="badge" style="background:var(--blue-bg);color:var(--blue-text)"><i class="ti ti-link" style="font-size:11px;vertical-align:-1px;margin-right:2px"></i>${esc(g.group)}</span>`:''}
        <span class="badge ${g.base?'base':''}">${g.base?'ベース':'追加'}</span>
        <button class="btn-icon" data-edit-gear="${g.id}"><i class="ti ti-edit" style="font-size:15px"></i></button>
        <button class="btn-icon danger" data-del-gear="${g.id}"><i class="ti ti-trash" style="font-size:17px"></i></button>
      </div>`;
    });
    h += `</div>`;
  });
  return h;
}

function renderGigDetail() {
  const gig = getGig(state.activeGigId);
  if (!gig) return '';
  const allItems = gigItems(gig);
  const included = allItems.filter(i=>i.included);
  const checks = gig.checks || [];
  const dateStr = gig.date ? new Date(gig.date+'T00:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}) : '';

  let h = `<button class="back-btn" id="back-btn"><i class="ti ti-arrow-left" style="font-size:18px"></i>一覧に戻る</button>`;

  if (state.editingGig) {
    h += gigForm(gig);
    h += `<div style="display:flex;gap:4px;margin-top:20px;margin-bottom:20px;border-bottom:0.5px solid var(--border);margin-left:-16px;margin-right:-16px;padding:0 16px">
      <button class="tab ${state.gigView==='list'?'active':''}" data-gig-tab="list">持ち物</button>
      <button class="tab ${state.gigView==='check'?'active':''}" data-gig-tab="check">当日チェック</button>
    </div>`;
  } else {
    h += `<div style="margin-bottom:4px">
      <div class="row-between">
        <span style="font-size:22px;font-weight:700">${dateStr || '日程未定'}</span>
        <button class="btn-icon" id="edit-gig-btn"><i class="ti ti-edit" style="font-size:18px"></i></button>
      </div>
      <div class="row-between" style="margin-top:4px">
        ${gig.artist?`<div style="font-size:16px;font-weight:500"><i class="ti ti-user" style="font-size:14px;vertical-align:-1px;margin-right:3px;color:var(--text2)"></i>${esc(gig.artist)}</div>`:'<span></span>'}
        ${gig.fee?`<span style="font-size:14px;color:var(--text2)">¥${gig.fee.toLocaleString()}</span>`:''}
      </div>
      <div class="gig-meta" style="margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        ${gigTypeBadge(gig.type)}
        ${!isAutoName(gig) ? `<span>${esc(gig.name)}</span>` : ''}
        ${gig.venue?`<span><i class="ti ti-map-pin" style="font-size:13px;vertical-align:-1px;margin-right:3px"></i>${esc(gig.venue)}</span>`:''}
      </div>
      ${gig.needsCar?`<div class="row" style="margin-top:8px;gap:8px">${carBadge(gig)}<button id="toggle-car-btn" data-gig-id="${gig.id}" style="font-size:12px;padding:4px 10px">${gig.carBooked?'予約を取り消す':'予約完了にする'}</button></div>`:''}
      ${gig.memo?`<div class="card" style="margin-top:10px;margin-bottom:0">
        <div class="card-pad">
          <div class="section-label" style="margin-bottom:6px">メモ</div>
          <div style="font-size:14px;white-space:pre-wrap;line-height:1.6">${esc(gig.memo)}</div>
        </div>
      </div>`:''}
    </div>
    <div style="display:flex;gap:4px;margin-bottom:20px;border-bottom:0.5px solid var(--border);margin-left:-16px;margin-right:-16px;padding:0 16px;margin-top:12px">
      <button class="tab ${state.gigView==='list'?'active':''}" data-gig-tab="list">持ち物</button>
      <button class="tab ${state.gigView==='check'?'active':''}" data-gig-tab="check">当日チェック</button>
    </div>`;
  }

  if (state.gigView === 'list') {
    const by = {};
    CATEGORIES.forEach(c => by[c] = []);
    allItems.filter(i => !i.extra && (i.base || i.included)).forEach(g => (by[g.cat]||by['その他']).push(g));

    CATEGORIES.forEach(cat => {
      if (!by[cat].length) return;
      h += `<div class="card" style="margin-bottom:10px">
        <div class="cat-label">${cat}</div>`;
      by[cat].forEach(g => {
        const incl = g.included;
        h += `<div class="item-row">
          <span class="name" style="${!incl?'text-decoration:line-through;color:var(--text3)':''}">${esc(g.name)}</span>
          <span class="qty">×${g.qty}</span>
          ${groupBadge(allItems, g)}
          ${g.base
            ? `<button class="toggle-btn ${incl?'included':'excluded'}" data-toggle="${g.id}">${incl?'含む':'除外'}</button>`
            : `<button class="btn-icon danger" data-remove-extra-gear="${g.id}"><i class="ti ti-trash" style="font-size:16px"></i></button>`}
        </div>`;
      });
      h += `</div>`;
    });

    const addable = state.gear.filter(g => !g.base && !allItems.find(i=>!i.extra && i.id===g.id && i.included));
    const pickerCat = state.pickerCat || 'all';
    const addableFiltered = pickerCat === 'all' ? addable : addable.filter(g => g.cat === pickerCat);

    if (state.showGearPicker) {
      h += `<div class="add-form">
        <div class="row" style="gap:6px;flex-wrap:wrap">
          <button class="toggle-btn ${pickerCat==='all'?'included':''}" data-picker-cat="all">すべて</button>
          ${CATEGORIES.map(c=>`<button class="toggle-btn ${pickerCat===c?'included':''}" data-picker-cat="${esc(c)}">${esc(c)}</button>`).join('')}
        </div>
        ${addableFiltered.length === 0
          ? `<div class="empty" style="padding:1.5rem 0">追加できる機材がありません</div>`
          : `<div class="card" style="margin:0">${addableFiltered.map(g=>`<div class="item-row">
              <span class="name">${esc(g.name)}</span>
              <span class="qty">×${g.qty}</span>
              <button class="btn-icon" data-add-extra-gear="${g.id}"><i class="ti ti-plus" style="font-size:17px;color:var(--teal)"></i></button>
            </div>`).join('')}</div>`}
        <button id="close-picker-btn">閉じる</button>
      </div>`;
    } else {
      h += `<button id="open-picker-btn" style="width:100%;justify-content:center;margin-bottom:16px"><i class="ti ti-plus"></i>機材を追加</button>`;
    }

    if ((gig.extras||[]).length > 0) {
      h += `<div class="section-label" style="margin-top:16px">この現場のみの追加</div>
      <div class="card" style="margin-bottom:10px">`;
      gig.extras.forEach(e => {
        h += `<div class="item-row">
          <span class="name">${esc(e.name)}</span>
          <span class="qty">×${e.qty}</span>
          <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--text2)">
            <input type="checkbox" data-toggle-delivered="${e.id}" ${e.delivered?'checked':''} style="width:16px;height:16px">預け済
          </label>
          <button class="btn-icon danger" data-del-extra="${e.id}"><i class="ti ti-trash" style="font-size:17px"></i></button>
        </div>`;
      });
      h += `</div>`;
    }

    if (state.showAddExtra) {
      h += `<div class="add-form">
        <input type="text" id="extra-name" placeholder="追加機材名">
        <input type="number" id="extra-qty" value="1" min="1" max="99" style="width:60px">
        <div class="row" style="justify-content:flex-end;gap:8px">
          <button id="cancel-extra">キャンセル</button>
          <button class="primary" id="save-extra">追加</button>
        </div>
      </div>`;
    } else {
      h += `<button id="add-extra-btn" style="width:100%;justify-content:center"><i class="ti ti-plus"></i>この現場だけの機材を追加</button>`;
    }
  } else {
    const pct = included.length > 0 ? Math.round(checks.length/included.length*100) : 0;
    h += `<div style="margin-bottom:16px">
      <div class="row-between" style="margin-bottom:6px">
        <span style="font-size:14px;color:var(--text2)">${checks.length}/${included.length}点</span>
        <span style="font-weight:600;font-size:16px;color:var(--teal)">${pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;
    if (checks.length > 0) {
      h += `<button id="clear-checks" style="margin-bottom:12px;font-size:13px"><i class="ti ti-refresh" style="font-size:14px"></i>リセット</button>`;
    }
    h += `<div class="card">`;
    included.forEach(g => {
      const checked = checks.includes(g.id);
      h += `<div class="check-row ${checked?'checked':''}" data-check="${g.id}">
        <input type="checkbox" ${checked?'checked':''} data-check-input="${g.id}">
        <span class="check-name">${esc(g.name)}</span>
        ${g.delivered?`<span class="badge" style="background:var(--teal-bg);color:var(--teal-text)">預け済</span>`:''}
        ${groupBadge(allItems, g, checks)}
        <span class="check-qty">×${g.qty}</span>
      </div>`;
    });
    h += `</div>`;
  }
  return h;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const root = document.getElementById('root');
  const mainTabs = document.getElementById('main-tabs');
  const appTitle = document.getElementById('app-title');

  if (state.view === 'gigDetail') {
    mainTabs.style.display = 'none';
    appTitle.style.display = 'none';
    root.innerHTML = renderGigDetail();
  } else {
    mainTabs.style.display = 'flex';
    appTitle.style.display = 'block';
    document.querySelectorAll('#main-tabs .tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === state.view);
    });
    root.innerHTML = state.view === 'gigs' ? renderGigs() : state.view === 'gear' ? renderGear() : renderRevenue();
  }
  attachEvents();
}

function renderRevenue() {
  const byMonth = {};
  state.gigs.forEach(g => {
    if (!g.date) return;
    const key = g.date.slice(0,7);
    if (!byMonth[key]) byMonth[key] = { total: 0, count: 0 };
    byMonth[key].total += g.fee || 0;
    byMonth[key].count += 1;
  });
  const months = Object.keys(byMonth).sort();
  let h = `<div class="section-label" style="margin-bottom:12px">月別売上</div>`;
  if (months.length === 0) {
    h += `<div class="empty"><i class="ti ti-coin" style="font-size:40px;display:block;margin-bottom:12px"></i>売上データがまだありません</div>`;
    return h;
  }
  const todayStr = new Date().toISOString().slice(0,10);
  const thisYear = String(new Date().getFullYear());

  const todoneTotal = state.gigs.filter(g => g.date && g.date <= todayStr).reduce((s,g)=>s+(g.fee||0), 0);
  const todoneExclTax = Math.round(todoneTotal / 1.1);
  const todoneTax = todoneTotal - todoneExclTax;

  const yearTotal = months.filter(m => m.startsWith(thisYear)).reduce((s,m)=>s+byMonth[m].total, 0);
  const yearExclTax = Math.round(yearTotal / 1.1);
  const yearTax = yearTotal - yearExclTax;

  h += `<div class="row" style="gap:10px;margin-bottom:16px;align-items:stretch">
    <div class="card-pad" style="background:var(--bg2);border-radius:var(--radius-lg);flex:1">
      <div style="font-size:12px;color:var(--text2)">今日までの売上（税別）</div>
      <div style="font-size:22px;font-weight:700;margin-top:2px">¥${todoneExclTax.toLocaleString()}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:4px">＋税 ¥${todoneTax.toLocaleString()}（税込 ¥${todoneTotal.toLocaleString()}）</div>
    </div>
    <div class="card-pad" style="background:var(--bg2);border-radius:var(--radius-lg);flex:1">
      <div style="font-size:12px;color:var(--text2)">${thisYear}年の売上見込み（税別）</div>
      <div style="font-size:22px;font-weight:700;margin-top:2px">¥${yearExclTax.toLocaleString()}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:4px">＋税 ¥${yearTax.toLocaleString()}（税込 ¥${yearTotal.toLocaleString()}）</div>
    </div>
  </div>`;
  h += `<div class="card">`;
  months.forEach((key, i) => {
    const [y,m] = key.split('-');
    const label = `${y}年${parseInt(m)}月`;
    h += `<div class="item-row" style="${i===months.length-1?'border-bottom:none':''}">
      <span class="name">${label}</span>
      <span style="font-size:13px;color:var(--text3)">${byMonth[key].count}件</span>
      <span style="font-weight:600;font-size:15px;margin-left:auto">¥${byMonth[key].total.toLocaleString()}</span>
    </div>`;
  });
  h += `</div>`;
  return h;
}

function attachEvents() {
  document.querySelectorAll('[data-tab]').forEach(el =>
    el.addEventListener('click', () => setState({view:el.dataset.tab, showAddGig:false, showAddGear:false})));
  document.querySelectorAll('[data-gig-tab]').forEach(el =>
    el.addEventListener('click', () => setState({gigView:el.dataset.gigTab})));
  document.querySelectorAll('[data-gig-filter]').forEach(el =>
    el.addEventListener('click', () => setState({gigFilter:el.dataset.gigFilter})));

  const backBtn = document.getElementById('back-btn');
  if (backBtn) backBtn.addEventListener('click', () => setState({view:'gigs', activeGigId:null}));

  const addGigBtn = document.getElementById('add-gig-btn');
  if (addGigBtn) addGigBtn.addEventListener('click', () => setState({showAddGig:true}));

  const cancelGigForm = document.getElementById('cancel-gig-form');
  if (cancelGigForm) cancelGigForm.addEventListener('click', () => setState({showAddGig:false, editingGig:false}));

  document.querySelectorAll('.type-opt').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.type-opt').forEach(o => o.classList.remove('type-selected'));
      el.classList.add('type-selected');
    });
  });

  const saveGigForm = document.getElementById('save-gig-form');
  if (saveGigForm) saveGigForm.addEventListener('click', () => {
    const type = document.querySelector('input[name="gig-type"]:checked')?.value || 'other';
    const rawName = document.getElementById('gig-f-name').value.trim();
    const name = rawName || GIG_TYPES[type].label;
    const artist = document.getElementById('gig-f-artist').value.trim();
    const venue = document.getElementById('gig-f-venue').value.trim();
    const date = document.getElementById('gig-f-date').value;
    const fee = parseInt(document.getElementById('gig-f-fee').value) || 0;
    const needsCar = document.getElementById('gig-f-needscar').checked;
    const memo = document.getElementById('gig-f-memo').value;
    const editId = saveGigForm.dataset.editId;
    if (editId) {
      const gig = getGig(+editId);
      const carBooked = needsCar ? gig.carBooked : false;
      Object.assign(gig, {name, artist, venue, date, fee, type, needsCar, carBooked, memo});
      saveAll(); setState({editingGig:false});
    } else {
      state.gigs.push({id:newId(), name, artist, venue, date, fee, type, needsCar, carBooked:false, memo, overrides:[], extras:[], checks:[]});
      saveAll(); setState({showAddGig:false});
    }
  });

  const editGigBtn = document.getElementById('edit-gig-btn');
  if (editGigBtn) editGigBtn.addEventListener('click', () => setState({editingGig:true}));

  const toggleCarBtn = document.getElementById('toggle-car-btn');
  if (toggleCarBtn) toggleCarBtn.addEventListener('click', () => {
    const gig = getGig(+toggleCarBtn.dataset.gigId);
    gig.carBooked = !gig.carBooked;
    saveAll(); render();
  });

  document.querySelectorAll('[data-del-gig]').forEach(el =>
    el.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm(`「${getGig(+el.dataset.delGig)?.name}」を削除しますか？`)) return;
      state.gigs = state.gigs.filter(g => g.id !== +el.dataset.delGig);
      saveAll(); render();
    }));

  document.querySelectorAll('.gig-card').forEach(el =>
    el.addEventListener('click', e => {
      if (e.target.closest('[data-del-gig]')) return;
      setState({view:'gigDetail', activeGigId:+el.dataset.gig, gigView:'list'});
    }));

  const addGearBtn = document.getElementById('add-gear-btn');
  if (addGearBtn) addGearBtn.addEventListener('click', () => setState({showAddGear:true, editingGearId:null}));

  const cancelGear = document.getElementById('cancel-gear');
  if (cancelGear) cancelGear.addEventListener('click', () => setState({showAddGear:false, editingGearId:null}));

  const saveGear = document.getElementById('save-gear');
  if (saveGear) saveGear.addEventListener('click', () => {
    const name = document.getElementById('gear-f-name').value.trim();
    if (!name) return;
    const qty = parseInt(document.getElementById('gear-f-qty').value) || 1;
    const cat = document.getElementById('gear-f-cat').value;
    const group = document.getElementById('gear-f-group').value.trim();
    const base = document.getElementById('gear-f-base').checked;
    const editId = saveGear.dataset.editId;
    if (editId) {
      const gear = state.gear.find(g => g.id === +editId);
      Object.assign(gear, {name, qty, cat, group, base});
    } else {
      state.gear.push({id:newId(), name, qty, cat, group, base});
    }
    saveAll(); setState({showAddGear:false, editingGearId:null});
  });

  document.querySelectorAll('[data-edit-gear]').forEach(el =>
    el.addEventListener('click', () => setState({showAddGear:true, editingGearId:+el.dataset.editGear})));

  document.querySelectorAll('[data-del-gear]').forEach(el =>
    el.addEventListener('click', () => {
      state.gear = state.gear.filter(g => g.id !== +el.dataset.delGear);
      saveAll(); render();
    }));

  const addCatBtn = document.getElementById('add-cat-btn');
  if (addCatBtn) addCatBtn.addEventListener('click', () => setState({showAddCat:true}));

  const cancelCat = document.getElementById('cancel-cat');
  if (cancelCat) cancelCat.addEventListener('click', () => setState({showAddCat:false}));

  const saveCat = document.getElementById('save-cat');
  if (saveCat) saveCat.addEventListener('click', () => {
    const name = document.getElementById('new-cat-name').value.trim();
    if (!name || CATEGORIES.includes(name)) return;
    CATEGORIES.push(name);
    saveAll(); setState({showAddCat:false});
  });

  document.querySelectorAll('[data-del-cat]').forEach(el =>
    el.addEventListener('click', () => {
      const i = +el.dataset.delCat;
      const cat = CATEGORIES[i];
      if (state.gear.some(g => g.cat === cat)) {
        alert(`「${cat}」に機材が登録されています。先に機材を削除または移動してください。`);
        return;
      }
      CATEGORIES.splice(i, 1);
      saveAll(); render();
    }));

  document.querySelectorAll('[data-cat-up]').forEach(el =>
    el.addEventListener('click', () => {
      const i = +el.dataset.catUp;
      [CATEGORIES[i-1], CATEGORIES[i]] = [CATEGORIES[i], CATEGORIES[i-1]];
      saveAll(); render();
    }));

  document.querySelectorAll('[data-cat-down]').forEach(el =>
    el.addEventListener('click', () => {
      const i = +el.dataset.catDown;
      [CATEGORIES[i], CATEGORIES[i+1]] = [CATEGORIES[i+1], CATEGORIES[i]];
      saveAll(); render();
    }));

  document.querySelectorAll('[data-toggle]').forEach(el =>
    el.addEventListener('click', () => {
      const gig = getGig(state.activeGigId);
      const gearId = +el.dataset.toggle;
      const gear = state.gear.find(g => g.id === gearId);
      if (!gig.overrides) gig.overrides = [];
      const idx = gig.overrides.findIndex(o => o.gearId === gearId);
      const cur = idx >= 0 ? gig.overrides[idx].included : gear.base;
      if (idx >= 0) gig.overrides[idx].included = !cur;
      else gig.overrides.push({gearId, included: !cur});
      saveAll(); render();
    }));

  const openPickerBtn = document.getElementById('open-picker-btn');
  if (openPickerBtn) openPickerBtn.addEventListener('click', () => setState({showGearPicker:true}));

  const closePickerBtn = document.getElementById('close-picker-btn');
  if (closePickerBtn) closePickerBtn.addEventListener('click', () => setState({showGearPicker:false}));

  document.querySelectorAll('[data-picker-cat]').forEach(el =>
    el.addEventListener('click', () => setState({pickerCat: el.dataset.pickerCat})));

  document.querySelectorAll('[data-add-extra-gear]').forEach(el =>
    el.addEventListener('click', () => {
      const gig = getGig(state.activeGigId);
      const gearId = +el.dataset.addExtraGear;
      if (!gig.overrides) gig.overrides = [];
      const idx = gig.overrides.findIndex(o => o.gearId === gearId);
      if (idx >= 0) gig.overrides[idx].included = true;
      else gig.overrides.push({gearId, included:true});
      saveAll(); render();
    }));

  document.querySelectorAll('[data-remove-extra-gear]').forEach(el =>
    el.addEventListener('click', () => {
      const gig = getGig(state.activeGigId);
      const gearId = +el.dataset.removeExtraGear;
      if (!gig.overrides) gig.overrides = [];
      const idx = gig.overrides.findIndex(o => o.gearId === gearId);
      if (idx >= 0) gig.overrides[idx].included = false;
      else gig.overrides.push({gearId, included:false});
      saveAll(); render();
    }));

  const addExtraBtn = document.getElementById('add-extra-btn');
  if (addExtraBtn) addExtraBtn.addEventListener('click', () => setState({showAddExtra:true}));

  const cancelExtra = document.getElementById('cancel-extra');
  if (cancelExtra) cancelExtra.addEventListener('click', () => setState({showAddExtra:false}));

  const saveExtra = document.getElementById('save-extra');
  if (saveExtra) saveExtra.addEventListener('click', () => {
    const name = document.getElementById('extra-name').value.trim();
    if (!name) return;
    const qty = parseInt(document.getElementById('extra-qty').value) || 1;
    const gig = getGig(state.activeGigId);
    if (!gig.extras) gig.extras = [];
    gig.extras.push({id:newId(), name, qty});
    saveAll(); setState({showAddExtra:false});
  });

  document.querySelectorAll('[data-del-extra]').forEach(el =>
    el.addEventListener('click', () => {
      const gig = getGig(state.activeGigId);
      gig.extras = gig.extras.filter(e => e.id !== +el.dataset.delExtra);
      saveAll(); render();
    }));

  document.querySelectorAll('[data-toggle-delivered]').forEach(el =>
    el.addEventListener('change', () => {
      const gig = getGig(state.activeGigId);
      const extra = gig.extras.find(e => e.id === +el.dataset.toggleDelivered);
      extra.delivered = el.checked;
      saveAll(); render();
    }));

  document.querySelectorAll('[data-check]').forEach(el =>
    el.addEventListener('click', e => {
      if (e.target.tagName === 'INPUT') return;
      const gig = getGig(state.activeGigId);
      const id = +el.dataset.check;
      if (!gig.checks) gig.checks = [];
      const idx = gig.checks.indexOf(id);
      if (idx >= 0) gig.checks.splice(idx, 1);
      else gig.checks.push(id);
      saveAll(); render();
    }));

  document.querySelectorAll('[data-check-input]').forEach(el =>
    el.addEventListener('change', () => {
      const gig = getGig(state.activeGigId);
      const id = +el.dataset.checkInput;
      if (!gig.checks) gig.checks = [];
      const idx = gig.checks.indexOf(id);
      if (el.checked && idx < 0) gig.checks.push(id);
      else if (!el.checked && idx >= 0) gig.checks.splice(idx, 1);
      saveAll(); render();
    }));

  const clearChecks = document.getElementById('clear-checks');
  if (clearChecks) clearChecks.addEventListener('click', () => {
    const gig = getGig(state.activeGigId);
    gig.checks = [];
    saveAll(); render();
  });
}

function exportData() {
  const data = { gear: state.gear, gigs: state.gigs, categories: CATEGORIES, nextId: state.nextId };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `drum-gear-backup-${today}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(file) {
  const reader = new FileReader();
  reader.onerror = () => alert('ファイルの読み取りに失敗しました（' + (reader.error?.name || '不明なエラー') + '）。');
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(reader.result);
    } catch (e) {
      alert('JSONの解析に失敗しました: ' + e.message);
      return;
    }
    if (!data || !data.gear || !data.gigs) {
      alert('ファイルの形式が正しくありません。「gear」と「gigs」のキーが見つかりませんでした。');
      return;
    }
    if (!confirm('現在のデータを上書きして読み込みます。よろしいですか？')) return;
    try {
      state.gear = data.gear;
      state.gigs = data.gigs;
      state.nextId = data.nextId || 100;
      CATEGORIES = data.categories || CATEGORIES;
      saveAll();
      setState({view:'gigs', activeGigId:null});
      alert('読み込みました。');
    } catch (e) {
      alert('読み込み中にエラーが発生しました: ' + e.message);
    }
  };
  reader.readAsText(file);
}

document.getElementById('export-btn').addEventListener('click', exportData);
document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) importData(file);
  e.target.value = '';
});

render();
</script>
</body>
</html>
