<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>笹川真生 セトリ検索</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      padding: 24px 20px 60px;
      background: #fff;
      color: #111;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }

    #page-nav {
      margin-bottom: 14px;
    }

    #page-nav a {
      font-size: 13px;
      color: #06c;
      text-decoration: none;
    }

    #page-nav a:hover {
      text-decoration: underline;
    }

    #search-box {
      font-family: inherit;
      font-size: 15px;
      padding: 8px 10px;
      width: 320px;
      max-width: 100%;
      border: 1px solid #999;
      border-radius: 6px;
      background: #fff;
      color: #111;
    }

    #tag-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag-btn {
      font-family: inherit;
      font-size: 12.5px;
      padding: 5px 12px;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      color: #555;
      cursor: pointer;
    }

    .tag-btn:hover {
      background: #f4f4f4;
    }

    .tag-btn.active {
      background: #111;
      border-color: #111;
      color: #fff;
    }

    .tag-badge {
      font-size: 11px;
      color: #888;
      background: #ececec;
      border-radius: 4px;
      padding: 2px 7px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .result-setlist {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      padding-left: 12px;
      border-left: 2px solid #eee;
      transition: max-height 0.35s ease, opacity 0.25s ease, margin-top 0.35s ease;
    }

    .result-row.open .result-setlist {
      max-height: 800px;
      opacity: 1;
      margin-top: 8px;
    }

    .result-setlist ol {
      margin: 0;
      padding-left: 1.4em;
      font-size: 13px;
      color: #444;
      line-height: 1.9;
    }

    .result-setlist mark {
      background: #fff2a8;
      color: #111;
      border-radius: 2px;
      padding: 0 2px;
    }

    #result-list {
      margin-top: 10px;
      padding: 0;
      list-style: none;
      max-width: 700px;
    }

    .year-header {
      font-size: 20px;
      font-weight: bold;
      color: #111;
      margin: 30px 0 10px;
      padding-bottom: 4px;
      border-bottom: 2px solid #111;
    }

    .year-header:first-child {
      margin-top: 0;
    }

    .result-row {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .result-date {
      font-weight: bold;
      flex-shrink: 0;
      color: #666;
      font-size: 13px;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      cursor: pointer;
      user-select: none;
      background: #f4f4f4;
      padding: 9px 12px;
      border-radius: 8px;
      transition: background 0.15s ease;
    }

    .result-header:hover {
      background: #eaeaea;
    }

    .result-header:active {
      background: #e0e0e0;
    }

    .result-event {
      color: #222;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .toggle-arrow {
      margin-left: auto;
      color: #06c;
      font-size: 12.5px;
      font-weight: bold;
      white-space: nowrap;
      padding-left: 8px;
      flex-shrink: 0;
    }

    .no-video {
      color: #aaa;
      font-size: 13px;
    }

    .result-row a {
      color: #06c;
      text-decoration: none;
    }

    .result-row a:hover {
      text-decoration: underline;
    }

    #hint {
      color: #999;
      font-size: 12px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div id="page-nav"><a href="analysis.html">→ 集計・分析ページ</a></div>
  <h1>笹川真生 セトリ検索</h1>
  <input type="text" id="search-box" placeholder="曲名で検索..." autocomplete="off">
  <div id="tag-filter"></div>
  <p id="hint"></p>

  <ul id="result-list"></ul>

  <script src="setlist-data.js"></script>
  <!-- 検索・表示ロジック -->
    <script>
      // 全曲リスト（表記ゆれをまとめたもの）を集計しておく（件数の目安表示用）
      const songSet = new Set();
      performances.forEach(perf => perf.setlist.forEach(rawSong => songSet.add(normalize(rawSong))));

      // 新しい順にソート、開閉状態を追うためのIDを振る
      const sortedPerformances = [...performances].sort((a, b) => b.date.localeCompare(a.date));
      sortedPerformances.forEach((perf, i) => { perf.id = i; });

      const searchBox = document.getElementById("search-box");
      const resultList = document.getElementById("result-list");
      const hint = document.getElementById("hint");
      const tagFilterBox = document.getElementById("tag-filter");

      // 同時に開けるアコーディオンは1公演だけ
      let openId = null;
      let activeTag = "すべて";

      TAGS.forEach(tag => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tag-btn" + (tag === activeTag ? " active" : "");
        btn.textContent = tag;
        btn.addEventListener("click", () => {
          activeTag = tag;
          tagFilterBox.querySelectorAll(".tag-btn").forEach(b => b.classList.toggle("active", b.textContent === tag));
          openId = null;
          render(searchBox.value);
        });
        tagFilterBox.appendChild(btn);
      });

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      function highlight(rawSong, q) {
        const safe = escapeHtml(rawSong);
        if (!q) return safe;
        const idx = safe.toLowerCase().indexOf(q.toLowerCase());
        if (idx === -1) return safe;
        return safe.slice(0, idx) + "<mark>" + safe.slice(idx, idx + q.length) + "</mark>" + safe.slice(idx + q.length);
      }

      function render(query) {
        const q = query.trim();
        const qLower = q.toLowerCase();

        const bySong = q === ""
          ? sortedPerformances
          : sortedPerformances.filter(perf =>
              perf.setlist.some(rawSong =>
                rawSong.toLowerCase().includes(qLower) || normalize(rawSong).toLowerCase().includes(qLower)
              )
            );

        const filtered = activeTag === "すべて"
          ? bySong
          : bySong.filter(perf => getTag(perf) === activeTag);

        hint.textContent = q === "" && activeTag === "すべて"
          ? `全 ${sortedPerformances.length} 公演 / ${songSet.size} 曲を収録`
          : `${filtered.length} 件ヒット（全 ${sortedPerformances.length} 公演中）`;

        resultList.innerHTML = "";

        const OPEN_LABEL = "セトリを見る ▶";
        const CLOSE_LABEL = "セトリを閉じる ▼";

        let lastYear = null;

        filtered.forEach(perf => {
          const year = perf.date.slice(0, 4);
          const monthDay = perf.date.slice(5);

          if (year !== lastYear) {
            const yearHeader = document.createElement("li");
            yearHeader.className = "year-header";
            yearHeader.textContent = year;
            resultList.appendChild(yearHeader);
            lastYear = year;
          }

          const li = document.createElement("li");
          const isOpen = perf.id === openId;
          li.className = "result-row" + (isOpen ? " open" : "");

          const venueText = perf.venue ? ` @${perf.venue}` : "";
          const fullTitle = escapeHtml(`${perf.event}${venueText}`);
          const tag = getTag(perf);
          const tagBadgeHtml = tag !== "イベント" ? `<span class="tag-badge">${tag}</span>` : "";

          let videoHtml;
          if (perf.video) {
            videoHtml = `<a href="${perf.video}" target="_blank">▶ 映像を見る</a>`;
          } else {
            videoHtml = `<span class="no-video">映像未リンク</span>`;
          }

          const setlistHtml = perf.setlist
            .map(rawSong => `<li>${highlight(rawSong, q)}</li>`)
            .join("");

          li.innerHTML = `
            <div class="result-header">
              <span class="result-date">${monthDay}</span>
              <span class="result-event" title="${fullTitle}">${fullTitle}</span>
              ${tagBadgeHtml}
              <span class="toggle-arrow">${isOpen ? CLOSE_LABEL : OPEN_LABEL}</span>
            </div>
            ${videoHtml}
            <div class="result-setlist"><ol>${setlistHtml}</ol></div>
          `;

          li.querySelector(".result-header").addEventListener("click", () => {
            const willOpen = !li.classList.contains("open");

            resultList.querySelectorAll(".result-row.open").forEach(openLi => {
              if (openLi !== li) {
                openLi.classList.remove("open");
                const otherArrow = openLi.querySelector(".toggle-arrow");
                if (otherArrow) otherArrow.textContent = OPEN_LABEL;
              }
            });

            li.classList.toggle("open", willOpen);
            li.querySelector(".toggle-arrow").textContent = willOpen ? CLOSE_LABEL : OPEN_LABEL;
            openId = willOpen ? perf.id : null;
          });

          resultList.appendChild(li);
        });
      }

      searchBox.addEventListener("input", () => {
        openId = null;
        render(searchBox.value);
      });
      render("");
    </script>

</body>
</html>
