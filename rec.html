<div id="album-container"></div>

<style>
  #album-container {
    position: relative;
    width: 100%;
    height: 80vh;
  }

  .album-item {
    position: absolute;
    width: 150px;
    height: 150px;
    cursor: pointer;
    transition: transform 0.3s ease;
  }

  .album-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.3s ease;
  }

  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.6);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    padding: 5px;
  }

  .album-item:hover img {
    filter: brightness(50%);
  }

  .album-item:hover .overlay {
    opacity: 1;
  }

  .overlay p {
    margin: 2px 0;
    font-size: 14px;
  }
</style>

<script>
const albums = [
  { src: "images/rec/jacket1.png", artist: "笹川真生", title: "サニーサイドへようこそ" },
  { src: "images/rec/jacket2.png", artist: "chilldspot", title: "echowaves" },
  { src: "images/album3.jpg", artist: "Artist 3", title: "Album 3" },
  { src: "images/album4.jpg", artist: "Artist 4", title: "Album 4" },
];

const container = document.getElementById("album-container");
const placedItems = []; // 既存アイテムの座標保存用
const ITEM_SIZE = 150;

function isOverlapping(x, y) {
  return placedItems.some(pos => {
    return !(x + ITEM_SIZE < pos.x || x > pos.x + ITEM_SIZE || y + ITEM_SIZE < pos.y || y > pos.y + ITEM_SIZE);
  });
}

albums.forEach(album => {
  const item = document.createElement("div");
  item.className = "album-item";

  const img = document.createElement("img");
  img.src = album.src;

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<p>${album.artist}</p><p>${album.title}</p>`;

  item.appendChild(img);
  item.appendChild(overlay);

  // 重なりを避けるランダム配置
  const maxX = container.clientWidth - ITEM_SIZE;
  const maxY = container.clientHeight - ITEM_SIZE;
  let x, y, tries = 0;

  do {
    x = Math.random() * maxX;
    y = Math.random() * maxY;
    tries++;
    if(tries > 100) break; // 試行回数上限
  } while (isOverlapping(x, y));

  item.style.left = x + "px";
  item.style.top = y + "px";
  placedItems.push({ x, y });

  // ランダム回転 -15°〜15°
  const angle = (Math.random() * 30) - 15;
  item.style.transform = `rotate(${angle}deg)`;

  container.appendChild(item);
});
</script>
