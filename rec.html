<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Recording</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
 <style>
  /* 散乱ジャケット */
  #works-area {
    position: relative;
    width: 100%;
    height: 150vh;
    overflow: visible;
  }

  .jacket-wrapper {
    position: absolute;
    width: 150px;
    height: 150px;
  }

  .jacket-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.25s, z-index 0.2s;
  }

  .jacket-wrapper:hover img {
    transform: scale(1.25) rotate(0deg) !important;
    z-index: 999;
  }

  /* ホバーで文字表示用 */
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.6);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    padding: 5px;
    border-radius: 8px;
  }

  .jacket-wrapper:hover .overlay {
    opacity: 1;
  }

  .overlay p {
    margin: 2px 0;
    font-size: 12px; /* 小さめに */
    line-height: 1.2;
  }
</style>

</head>

<body>

  <div id="title-wrapper">
    <h1 onclick="location.href='index.html';">嶋英治</h1>
    <h2>recording</h2>
  </div>

  <div class="sidebar">
    <p><a href="live.html">Live archive</a></p>
    <p><a href="rec.html">Recording</a></p>
    <p><a href="diary.html">Diary</a></p>
    <p><a href="profile.html">Profile</a></p>
  </div>

  <!-- ▼ここに散乱ジャケットを表示 ▼ -->
  <div id="works-area"></div>
  <!-- ▲ここに散乱ジャケットを表示 ▲ -->

  <script>
  const jackets = [
    { src: "jacket1.png", artist: "笹川真生", title: "サニーサイドへようこそ", link: "https://www.maosasagawa.jp/products/ssgw000-0003" },
    { src: "jacket2.png", artist: "chilldspot", title: "echowaves", link: "https://chilldspot.jp/discography/detail/6048/" },
    { src: "jacket3.png", artist: "chilldspot", title: "僕たちは息をして", link: "https://chilldspot.jp/discography/detail/6070/" },
    { src: "jacket4.png", artist: "chilldspot", title: "chilldspot 4th one man live tour crowdsurf in Zepp Shinjuku(TOKYO)", link: "https://chilldspot.jp/discography/detail/6043/" },
    { src: "jacket5.png", artist: "chilldspot", title: "chilldspot 3rd one man live tour 模様 in Zepp DiverCity", link: "https://chilldspot.jp/discography/detail/6044/" },
    { src: "jacket6.png", artist: "chilldspot", title: "handmade", link: "https://chilldspot.jp/discography/detail/6039/" },
    { src: "jacket7.png", artist: "理芽", title: "狂えない", link: "https://kamitsubaki.jp/discography/rim/1779/" },
    { src: "jacket8.png", artist: "うたたねくらげ", title: "from: Livings", link: "https://utatanekurage.bandcamp.com/album/from-livings" },
    { src: "jacket9.png", artist: "MOMOKA YOKOYAMA", title: "崩壊", link: "https://www.youtube.com/watch?v=7GUSjpo13K4" },
    { src: "jacket10.png", artist: "MOMOKA YOKOYAMA", title: "Lost heart", link: "https://www.youtube.com/watch?v=0TIriWKhEKc" },
    { src: "jacket11.png", artist: "Landdo", title: "ULTRAPANIC", link: "https://ultrapanic.com/" },




    
    // 他も同様に追加
  ];

  const area = document.getElementById("works-area");
  const areaWidth = window.innerWidth;
  const areaHeight = window.innerHeight * 1.5;

  jackets.forEach(j => {
    const wrapper = document.createElement("div");
    wrapper.className = "jacket-wrapper";

    const link = document.createElement("a");
    link.href = j.link;
    link.target = "_blank"; // 新しいタブで開く

    const img = document.createElement("img");
    img.src = "images/rec/" + j.src;

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<p>${j.artist}</p><p>${j.title}</p>`;

    link.appendChild(img);
    link.appendChild(overlay);
    wrapper.appendChild(link);

    const x = Math.random() * (areaWidth - 150);
    const y = Math.random() * (areaHeight - 150);
    const rot = (Math.random() * 80) - 40;
    const scale = 0.9 + Math.random() * 0.2;

    wrapper.style.left = `${x}px`;
    wrapper.style.top = `${y}px`;
    wrapper.style.transform = `rotate(${rot}deg) scale(${scale})`;
    wrapper.style.zIndex = Math.floor(Math.random() * 30);

    area.appendChild(wrapper);
  });
</script>
  
  <script src="random.js"></script>
</body>
</html>
