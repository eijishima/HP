<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>嶋英治</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .centered-text {
      position: relative;
      margin: 450px 0px 10px 0px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      height: 100%;
      z-index: 2;
      padding: 20px;
      color: #000;
    }

    h1 {
      margin-left: 50px;
      position: relative;
      display: inline-block;
      line-height: 1.2;
    }

    h1 span {
      position: absolute;
      display: inline-block;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    a {
      text-decoration: none;
      color: #000;
      display: inline-block;
      padding-left: 8px;
      transition: transform 0.15s ease;
    }

    nav a {
      margin-right: 15px;
    }

    li, p, a {
      display: block;
      transition: transform 0.15s ease;
    }

    li:hover,
    p:hover,
    a:hover {
      transform: scale(1.02);
    }

    .centered-text p,
    .centered-text nav {
      margin: 5px 0;
    }

    #light-switch {
      position: fixed;
      right: 24px;
      top: 24px;
      width: 90px;
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.15s ease, opacity 0.3s ease;
    }

    #light-switch:hover {
      transform: scale(1.04);
    }

    #fade-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.35s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="background" src="haikei.png" alt="背景画像">

    <h1 id="title" onclick="location.href='index.html';">嶋英治</h1>

    <div class="centered-text">
      <nav>
        <p><a href="live.html">Live archive</a></p>
        <p><a href="rec.html">Recording</a></p>
        <p><a href="profile.html">Profile</a></p>
      </nav>

      <p><a href="mailto:waiga.hatoyade@gmail.com">waiga.hatoyade@gmail.com</a></p>
    </div>
  </div>

  <img id="light-switch" src="switch-off.png" alt="light switch">
  <div id="fade-overlay"></div>
  <audio id="switch-sound" src="switch.mp3" preload="auto"></audio>

  <script>
    const title = document.getElementById('title');
    const text = title.textContent;
    title.innerHTML = '';

    const maxOffset = 35;

    for (let char of text) {
      const span = document.createElement('span');
      span.textContent = char;
      const x = Math.floor(Math.random() * (maxOffset * 2 + 1)) - maxOffset;
      const y = Math.floor(Math.random() * (maxOffset * 2 + 1)) - maxOffset;
      span.style.left = `${x}px`;
      span.style.top = `${y}px`;
      title.appendChild(span);
    }

    const switchBtn = document.getElementById("light-switch");
    const fadeOverlay = document.getElementById("fade-overlay");
    const switchSound = document.getElementById("switch-sound");

    switchBtn.addEventListener("click", () => {
      switchBtn.src = "switch-on.png";

      if (switchSound) {
        switchSound.currentTime = 0;
        switchSound.play().catch(() => {});
      }

      setTimeout(() => {
        fadeOverlay.style.opacity = "1";
      }, 80);

      setTimeout(() => {
        window.location.href = "diary.html";
      }, 430);
    });

    window.addEventListener("pageshow", () => {
      fadeOverlay.style.opacity = "0";
      switchBtn.src = "switch-off.png";
    });
  </script>
</body>
</html>
