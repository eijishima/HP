<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>嶋英治</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* 中央テキスト */
   .centered-text {
  position: relative;
  margin: 450px 0px 10px 0px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end; /* 高さ下寄せ */
  align-items: flex-start;   /* 左揃え */
  height: 100%;
  z-index: 2; /* 背景画像より上に表示 */
  padding: 20px;
  color: #000; /* 黒文字 */
}

h1{margin-left: 50px}

    ul {
      list-style: none;
      padding: 0;
    }

    a {
      text-decoration: none;
      color: #000;
    }

    nav a {
      margin-right: 15px;
    }

    li, p, a {
  display: block;   /* 行でまとまる */
  transition: transform 0.15s ease;
  }

li:hover,
p:hover,
a:hover {
  transform: scale(1.02);
}
a {
  display: inline-block;
  padding-left: 8px;  /* ← 好きな値に調整 */
  transition: transform 0.15s ease;
}

    .centered-text p,
    .centered-text nav {
      margin: 5px 0;
    }

    a {
      text-decoration: none;
      color: #000; /* 黒リンク */
    }

    nav a {
      margin-right: 15px;
    }

    #light-switch {
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 48px;
  cursor: pointer;
  z-index: 10;
  transition: transform 0.15s ease, opacity 0.3s ease;
}

#light-switch:hover {
  transform: scale(1.04);
}

body {
  transition: opacity 0.35s ease;
}
  </style>
</head>
<body>
  <div class="container">

    <!-- 背景画像（文字の背面） -->
    <img class="background" src="haikei.png" alt="背景画像">

    <h1 id="title" onclick="location.href='index.html';">嶋英治</h1>
    
    <!-- 中央テキスト -->
    <div class="centered-text">

      <nav>
       <p><a href="live.html">Live archive</a></p>
        <p><a href="rec.html">Recording</a></p>
       <p><a href="profile.html">Profile</a></p> 
      </nav>

      <p><a href="mailto:waiga.hatoyade@gmail.com">waiga.hatoyade@gmail.com</a></p>
    </div>

  </div>
  
<img id="light-switch" src="switch-off.png" alt="light switch">
  
  <script>
    const title = document.getElementById('title');
    const text = title.textContent;
    title.innerHTML = '';

    const maxOffset = 35; // ±35pxのランダムずれ

    for (let char of text) {
      const span = document.createElement('span');
      span.textContent = char;
      const x = Math.floor(Math.random() * (maxOffset*2+1)) - maxOffset;
      const y = Math.floor(Math.random() * (maxOffset*2+1)) - maxOffset;
      span.style.left = `${x}px`;
      span.style.top = `${y}px`;
      title.appendChild(span);
    }

<script>
  const switchBtn = document.getElementById("light-switch");

  switchBtn.addEventListener("click", () => {
    // まず画像をONに切り替える
    switchBtn.src = "switch-on.png";

    // 少し待ってから暗転 → diaryへ移動
    setTimeout(() => {
      document.body.style.opacity = "0";
    }, 80);

    setTimeout(() => {
      window.location.href = "diary.html";
    }, 430);
  });
</script>
    
  </script>
</body>
</html>
