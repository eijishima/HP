<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>diary</title>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: 'IBM Plex Sans', 'Noto Sans JP', sans-serif;
    }

    a {
      color: #fff;
      text-decoration: none;
      display: inline-block;
      padding-left: 8px;
      transition: transform 0.15s ease;
    }

    nav a {
      margin-right: 15px;
    }

    li, p, a {
      display: block;
      transition: transform 0.15s ease;
    }

    li:hover,
    p:hover,
    a:hover {
      transform: scale(1.02);
    }

    #light-switch {
      position: fixed;
      right: 24px;
      top: 24px;
      width: 90px;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s ease, opacity 0.3s ease;
    }

    #light-switch:hover {
      transform: scale(1.04);
    }

    #fade-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.35s ease;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <p><a href="live.html">Live archive</a></p>
    <p><a href="rec.html">Recording</a></p>
    <p><a href="diary.html">Diary</a></p>
    <p><a href="profile.html">Profile</a></p>
  </div>

  <div id="title-wrapper">
    <h1 onclick="location.href='index.html';">嶋英治</h1>
    <h2>diary</h2>
  </div>

  <div id="honbun">
    <ul id="diary-list"></ul>
  </div>

  <img id="light-switch" src="switch-on.png" alt="light switch">
  <div id="fade-overlay"></div>
  <audio id="switch-sound" src="switch.mp3" preload="auto"></audio>

  <script>
    const diaryEntries = [
      { date: "ここには　まだ　なにも　ないみたい！", url: "https://www.soundhouse.co.jp/?srsltid=AfmBOopdOEE6ZSknsytiiunhSNerzdMtCwdWZMw-uTmUIhIj7OQdPCbG" }
    ];

    const list = document.getElementById("diary-list");

    diaryEntries.forEach(entry => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.textContent = entry.date;
      a.href = entry.url;
      a.target = "_blank";
      li.appendChild(a);
      list.appendChild(li);
    });

    const switchBtn = document.getElementById("light-switch");
    const fadeOverlay = document.getElementById("fade-overlay");
    const switchSound = document.getElementById("switch-sound");

    switchBtn.addEventListener("click", () => {
      switchBtn.src = "switch-off.png";
      switchBtn.style.opacity = "0";

      if (switchSound) {
        switchSound.currentTime = 0;
        switchSound.play().catch(() => {});
      }

      setTimeout(() => {
        fadeOverlay.style.opacity = "1";
      }, 80);

      setTimeout(() => {
        window.location.href = "index.html";
      }, 430);
    });

    window.addEventListener("pageshow", () => {
      fadeOverlay.style.opacity = "0";
      switchBtn.src = "switch-on.png";
      switchBtn.style.opacity = "1";
    });
  </script>

  <script src="random.js"></script>
</body>
</html>
