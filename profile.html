<!DOCTYPE html>
<html lang="ja">
<head>

  <link rel="stylesheet" href="style.css">

  <style>
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      text-align: center;
    }

    .profile-photo {
      display: block;
      margin: 20px auto;
      width: 200px;        /* 写真サイズ */
      height: 200px;
      object-fit: cover;
    }

    #honbun a {
      display: block;
      margin: 5px 0;
      text-decoration: none;
      color: #000;
    }
  </style>
</head>

<body>

  <div id="title-wrapper">
    <h1 onclick="location.href='index.html';">嶋英治</h1>

  </div>

  <div class="sidebar">
    <p><a href="live.html">Live archive</a></p>

    <p><a href="profile.html">Profile</a></p>
 
  </div>

  <!-- 手書き風にしたい文字 -->
  <p id="centerText" class="center-text">嶋英治しまえいじEijiShima - 1998.9.20</p>

  <!-- シンプルに中央写真 -->
<img id="profilePhoto" src="images/face/face1.png" class="profile-photo" alt="Profile Photo">

  <script>
  // 切り替えたい写真をリストに入れる
  const photos = [
    "images/face/face1.png",
    "images/face/face2.png",
     "images/face/face3.png",
    "images/face/face4.png",
 "images/face/face5.png",
     "images/face/face6.png",
  ];

  let currentIndex = 0; // 今どの写真か

  const img = document.getElementById("profilePhoto");

  img.addEventListener("click", () => {
    // 次の写真へ
    currentIndex = (currentIndex + 1) % photos.length;
    img.src = photos[currentIndex];
  });
</script>


  <div id="honbun">
    <p><a href="https://x.com/Eijishimagon" target="_blank">X</a></p>

    <p><a href="mailto:waiga.hatoyade@gmail.com">waiga.hatoyade@gmail.com</a></p>
  </div>

  <!-- 散らす文字用スクリプト -->
  <script src="random.js"></script>

  <script>
    const p = document.getElementById('centerText');
    const text = p.textContent;
    p.innerHTML = '';

    for (let char of text) {
      const span = document.createElement('span');
      span.textContent = char;
      span.style.display = 'inline-block';

      const rotate = (Math.random() * 10) - 5;
      const y = (Math.random() * 6) - 3;
      const scale = 1 + (Math.random() * 0.12 - 0.06);

      span.style.transform = `
        rotate(${rotate}deg)
        translateY(${y}px)
        scale(${scale})
      `;

      p.appendChild(span);
    }
  </script>

</body>
</html>
