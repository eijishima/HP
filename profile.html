        <!-- 散らす文字用スクリプト -->
  <script src="random.js"></script>

<script>
  const p = document.getElementById('centerText');
  const text = p.textContent;
  p.innerHTML = ''; // 元のテキストをクリア

  for (let char of text) {
    const span = document.createElement('span');
    span.textContent = char;
    span.style.display = 'inline-block';

    // 手書き風ガタガタ
    const rotate = (Math.random() * 10) - 5;          // -5°〜+5°
    const y = (Math.random() * 6) - 3;                // -3px〜+3px
    const scale = 1 + (Math.random() * 0.12 - 0.06);  // ±6%

    span.style.transform = `
      rotate(${rotate}deg)
      translateY(${y}px)
      scale(${scale})
    `;

    p.appendChild(span);
  }
</script>
