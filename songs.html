<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>笹川真生 楽曲データ</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      padding: 24px 20px 60px;
      background: #fff;
      color: #111;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }

    #page-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    #page-nav a {
      display: inline-block;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      background: #06c;
      padding: 9px 18px;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    #page-nav a:hover {
      background: #058;
    }

    #search-box {
      font-family: inherit;
      font-size: 15px;
      padding: 8px 10px;
      width: 320px;
      max-width: 100%;
      border: 1px solid #999;
      border-radius: 6px;
      background: #fff;
      color: #111;
    }

    #hint {
      color: #999;
      font-size: 12px;
      margin: 8px 0 0;
    }

    #song-table {
      --cols: minmax(0, 1.25fr) 52px 92px minmax(0, 1fr) 54px;
      max-width: 900px;
      margin-top: 12px;
    }

    .list-header,
    .row-main {
      display: grid;
      grid-template-columns: var(--cols);
      column-gap: 10px;
      align-items: center;
    }

    .list-header {
      padding: 4px 0;
      border-bottom: 1px solid #ddd;
      font-size: 11px;
      color: #999;
    }

    .list-header .h-num,
    .row-main .c-bpm {
      text-align: right;
      padding-right: 8px;
    }

    #song-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .song-row {
      padding: 7px 0;
      border-bottom: 1px solid #eee;
    }

    .song-row.group-start { margin-top: 12px; }

    .section-header {
      margin: 26px 0 6px;
      padding-bottom: 4px;
      border-bottom: 2px solid #111;
      font-size: 14px;
      font-weight: bold;
    }

    .c-name {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .trk {
      flex: 0 0 1.7em;
      text-align: right;
      color: #aaa;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .nm {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: #222;
    }

    .meta { display: contents; }

    .c-bpm,
    .c-rel {
      font-size: 12.5px;
      color: #444;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .c-album {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
      color: #444;
    }

    .is-empty { color: #ccc !important; }

    .stem-link {
      color: #06c;
      font-weight: bold;
      font-size: 12.5px;
      text-decoration: none;
    }

    .stem-link:hover { text-decoration: underline; }

    @media (max-width: 639px) {
      .list-header { display: none; }

      .row-main {
        grid-template-columns: minmax(0, 1fr);
        row-gap: 5px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 14px;
        padding-left: calc(1.7em + 6px);
      }

      .meta > span.is-empty { display: none; }

      .meta > span::before {
        content: attr(data-label) " ";
        font-size: 11px;
        color: #aaa;
      }

      .meta > span[data-label=""]::before { content: none; }

      .c-bpm { text-align: left; padding-right: 0; }
    }
  </style>
</head>
<body>

  <div id="page-nav">
    <a href="setlist.html">← セトリ検索</a>
    <a href="analysis.html">→ 集計・分析ページ</a>
  </div>
  <h1>笹川真生 楽曲データ</h1>

  <input type="text" id="search-box" placeholder="曲名で検索..." autocomplete="off">
  <p id="hint"></p>

  <div id="song-table">
    <div class="list-header">
      <span>曲名</span>
      <span class="h-num">BPM</span>
      <span>リリース日</span>
      <span>アルバム名</span>
      <span>STEM</span>
    </div>
    <ul id="song-list"></ul>
  </div>

  <script src="setlist-data.js"></script>
  <script src="song-meta.js"></script>
  <script>
    const EMPTY_META = { bpm: "", release: "", album: "", track: "", stem: "" };

    const searchBox = document.getElementById("search-box");
    const hint = document.getElementById("hint");
    const songList = document.getElementById("song-list");

    // 今までやった全曲（表記ゆれを正規化）と演奏回数
    const plays = new Map();
    performances.forEach(perf => perf.setlist.forEach(raw => {
      const song = normalize(raw);
      plays.set(song, (plays.get(song) || 0) + 1);
    }));
    const allSongs = Array.from(plays.keys());

    function getMeta(song) {
      return Object.assign({}, EMPTY_META, songMeta[song]);
    }

    function hasAnyMeta(m) {
      return Object.values(m).some(v => String(v) !== "");
    }

    function isHttpUrl(str) {
      return /^https?:\/\/\S+$/i.test(str);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // リリース日の新しい順 → 同じアルバムは曲順どおりにまとめる。未入力の曲は最後。
    function orderSongs(songs) {
      const groups = new Map();
      const unset = [];

      songs.forEach(song => {
        const m = getMeta(song);
        if (!m.release && !m.album) { unset.push(song); return; }
        const key = m.album ? "a:" + m.album : "s:" + song;
        if (!groups.has(key)) groups.set(key, { key, release: "", album: m.album, songs: [] });
        const g = groups.get(key);
        if (m.release > g.release) g.release = m.release;
        g.songs.push(song);
      });

      const trackOf = s => Number(getMeta(s).track) || Infinity;
      const sortedGroups = Array.from(groups.values()).sort((a, b) =>
        b.release.localeCompare(a.release) || a.album.localeCompare(b.album, "ja"));

      const out = [];
      sortedGroups.forEach(g => {
        g.songs.sort((a, b) => trackOf(a) - trackOf(b) || a.localeCompare(b, "ja"));
        g.songs.forEach((song, i) => out.push({ song, groupStart: i === 0 && out.length > 0 }));
      });

      unset.sort((a, b) => plays.get(b) - plays.get(a) || a.localeCompare(b, "ja"));
      unset.forEach((song, i) => out.push({ song, unsetStart: i === 0 }));
      return out;
    }

    function cell(cls, label, html) {
      return `<span class="${cls}${html ? "" : " is-empty"}" data-label="${label}">${html || "—"}</span>`;
    }

    function render() {
      const q = searchBox.value.trim().toLowerCase();
      const ordered = orderSongs(allSongs).filter(item => q === "" || item.song.toLowerCase().includes(q));

      const filled = allSongs.filter(s => hasAnyMeta(getMeta(s))).length;
      hint.textContent = `${ordered.length} 曲を表示中（全 ${allSongs.length} 曲 / 入力済み ${filled} 曲）`;

      songList.innerHTML = "";

      ordered.forEach(item => {
        const song = item.song;
        const m = getMeta(song);

        if (item.unsetStart) {
          const header = document.createElement("li");
          header.className = "section-header";
          header.textContent = "リリース日・アルバム未入力";
          songList.appendChild(header);
        }

        const li = document.createElement("li");
        li.className = "song-row" + (item.groupStart ? " group-start" : "");

        const stemHtml = isHttpUrl(m.stem)
          ? `<a class="stem-link" href="${escapeHtml(m.stem)}" target="_blank" rel="noopener noreferrer">STEM</a>`
          : "";
        const trackText = m.track !== "" ? String(m.track).padStart(2, "0") : "";

        li.innerHTML = `
          <div class="row-main">
            <span class="c-name"><span class="trk">${trackText}</span><span class="nm" title="${escapeHtml(song)}">${escapeHtml(song)}</span></span>
            <div class="meta">
              ${cell("c-bpm", "BPM", m.bpm !== "" ? escapeHtml(m.bpm) : "")}
              ${cell("c-rel", "リリース", escapeHtml(m.release))}
              ${cell("c-album", "アルバム", escapeHtml(m.album))}
              ${cell("c-stem", "", stemHtml)}
            </div>
          </div>
        `;

        songList.appendChild(li);
      });
    }

    searchBox.addEventListener("input", render);
    render();
  </script>

</body>
</html>
