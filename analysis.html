<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>笹川真生 セトリ集計</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      padding: 24px 20px 60px;
      background: #fff;
      color: #111;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 4px;
    }

    #page-nav {
      margin-bottom: 18px;
    }

    #page-nav a {
      display: inline-block;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      background: #06c;
      padding: 9px 18px;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.15s ease;
    }

    #page-nav a:hover {
      background: #058;
    }

    #search-box {
      font-family: inherit;
      font-size: 15px;
      padding: 8px 10px;
      width: 320px;
      max-width: 100%;
      border: 1px solid #999;
      border-radius: 6px;
      background: #fff;
      color: #111;
    }

    #tag-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag-btn {
      font-family: inherit;
      font-size: 12.5px;
      padding: 5px 12px;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      color: #555;
      cursor: pointer;
    }

    .tag-btn:hover {
      background: #f4f4f4;
    }

    .tag-btn.active {
      background: #111;
      border-color: #111;
      color: #fff;
    }

    #hint {
      color: #999;
      font-size: 12px;
      margin-top: 8px;
    }

    #song-list {
      margin-top: 14px;
      padding: 0;
      list-style: none;
      max-width: 700px;
    }

    .list-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      margin-top: 10px;
      border-bottom: 1px solid #ddd;
      font-size: 11px;
      color: #999;
    }

    .list-header .h-label {
      flex: 0 0 34%;
    }

    .list-header .h-track {
      flex: 1;
    }

    .list-header .h-value {
      flex: 0 0 28px;
      text-align: right;
    }

    .list-header .h-date {
      flex: 0 0 82px;
      text-align: right;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid #eee;
    }

    .bar-label {
      flex: 0 0 34%;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: #333;
    }

    .bar-track {
      flex: 1;
      min-width: 0;
      height: 14px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #06c;
      border-radius: 4px;
      min-width: 2px;
    }

    .bar-value {
      flex: 0 0 28px;
      text-align: right;
      font-size: 12.5px;
      font-weight: bold;
      color: #06c;
    }

    .bar-lastdate {
      flex: 0 0 82px;
      text-align: right;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>

  <div id="page-nav"><a href="setlist.html">← セトリ検索に戻る</a></div>
  <h1>笹川真生 セトリ集計</h1>

  <input type="text" id="search-box" placeholder="曲名で検索..." autocomplete="off">
  <div id="tag-filter"></div>
  <p id="hint"></p>

  <div class="list-header">
    <span class="h-label">曲名</span>
    <span class="h-track"></span>
    <span class="h-value">回数</span>
    <span class="h-date">最後にやった日</span>
  </div>
  <ul id="song-list"></ul>

  <script src="setlist-data.js"></script>
  <script>
    const searchBox = document.getElementById("search-box");
    const tagFilterBox = document.getElementById("tag-filter");
    const songList = document.getElementById("song-list");
    const hint = document.getElementById("hint");

    let activeTag = "すべて";

    TAGS.forEach(tag => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tag-btn" + (tag === activeTag ? " active" : "");
      btn.textContent = tag;
      btn.addEventListener("click", () => {
        activeTag = tag;
        tagFilterBox.querySelectorAll(".tag-btn").forEach(b => b.classList.toggle("active", b.textContent === tag));
        render();
      });
      tagFilterBox.appendChild(btn);
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // 曲ごとに集計：回数・最後にやった日
    function buildStats(perfList) {
      const stats = new Map();
      perfList.forEach(perf => {
        perf.setlist.forEach(rawSong => {
          const song = normalize(rawSong);
          if (!stats.has(song)) stats.set(song, { song, count: 0, lastDate: null });
          const s = stats.get(song);
          s.count += 1;
          if (!s.lastDate || perf.date > s.lastDate) {
            s.lastDate = perf.date;
          }
        });
      });
      return Array.from(stats.values());
    }

    function render() {
      const q = searchBox.value.trim().toLowerCase();

      const perfInScope = activeTag === "すべて"
        ? performances
        : performances.filter(perf => getTag(perf) === activeTag);

      let stats = buildStats(perfInScope);

      if (q !== "") {
        stats = stats.filter(s => s.song.toLowerCase().includes(q));
      }

      stats.sort((a, b) => b.count - a.count || b.lastDate.localeCompare(a.lastDate));

      hint.textContent = `${stats.length} 曲を表示中（${perfInScope.length} 公演分から集計）`;

      songList.innerHTML = "";

      const maxCount = stats.length ? stats[0].count : 1;

      stats.forEach(s => {
        const li = document.createElement("li");
        li.className = "bar-row";
        li.title = `最後にやった日：${s.lastDate}`;

        const pct = Math.max((s.count / maxCount) * 100, 2);

        li.innerHTML = `
          <span class="bar-label" title="${escapeHtml(s.song)}">${escapeHtml(s.song)}</span>
          <div class="bar-track"><div class="bar-fill" style="width: ${pct}%"></div></div>
          <span class="bar-value">${s.count}</span>
          <span class="bar-lastdate">${s.lastDate}</span>
        `;
        songList.appendChild(li);
      });
    }

    searchBox.addEventListener("input", render);
    render();
  </script>

</body>
</html>
