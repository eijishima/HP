<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>笹川真生 セトリ作成</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      padding: 24px 20px 60px;
      background: #fff;
      color: #111;
    }

    h1 { font-size: 18px; margin: 0 0 4px; }
    h2 { font-size: 14px; margin: 0 0 10px; }

    #page-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    #page-nav a {
      display: inline-block;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      background: #06c;
      padding: 9px 18px;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    #page-nav a:hover { background: #058; }

    #page-nav .current {
      display: inline-block;
      font-size: 14px;
      font-weight: bold;
      color: #888;
      background: #ddd;
      padding: 9px 18px;
      border-radius: 999px;
      cursor: default;
      user-select: none;
    }

    .wrap { max-width: 900px; }

    input[type="text"], input[type="date"], input[type="number"] {
      font-family: inherit;
      font-size: 15px;
      padding: 8px 10px;
      border: 1px solid #999;
      border-radius: 6px;
      background: #fff;
      color: #111;
      max-width: 100%;
    }

    /* ---------- 作成ゾーン ---------- */
    #maker {
      margin-top: 12px;
      padding: 16px;
      border: 2px solid #111;
      border-radius: 10px;
      background: #fafafa;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
      margin-bottom: 14px;
    }
    .info-grid label { display: block; font-size: 11px; color: #777; margin-bottom: 3px; }
    .info-grid input { width: 100%; }
    .info-grid .full { grid-column: 1 / -1; }

    #summary {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 16px;
      padding: 10px 0;
      border-top: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      font-size: 13px;
    }
    #summary .total { font-size: 20px; font-weight: bold; font-variant-numeric: tabular-nums; }
    #summary .ok { color: #1a7f37; font-weight: bold; }
    #summary .over { color: #c62828; font-weight: bold; }
    #summary .warn { color: #b26a00; font-size: 12px; }

    #build-list { list-style: none; margin: 0; padding: 0; }
    .build-row {
      display: grid;
      grid-template-columns: 22px 26px minmax(0, 1fr) 62px 44px auto;
      column-gap: 8px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #e5e5e5;
      background: #fafafa;
      user-select: none;
    }
    .build-row.dragging { background: #e8f1fb; box-shadow: 0 2px 8px rgba(0,0,0,0.18); position: relative; z-index: 2; }
    .grip { cursor: grab; touch-action: none; color: #999; text-align: center; font-size: 16px; line-height: 1; padding: 6px 0; }
    .build-row.dragging .grip { cursor: grabbing; }
    .build-row .no { text-align: right; color: #aaa; font-size: 12px; font-variant-numeric: tabular-nums; }
    .nmwrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .nmwrap .nm { flex: 0 1 auto; }
    .ver { font-family: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid #b26a00; border-radius: 6px; color: #b26a00; background: #fff; max-width: 190px; }
    .alt-badge { font-size: 10.5px; color: #b26a00; border: 1px solid #b26a00; border-radius: 999px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }
    .namecell { min-width: 0; }
    .alt-note { display: block; font-size: 11px; color: #b26a00; margin-top: 2px; }
    .section-header { margin: 22px 0 4px; padding-bottom: 4px; border-bottom: 2px solid #111; font-size: 13px; font-weight: bold; }
    .build-row .nm { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .build-row.mc .nm { color: #b26a00; font-weight: bold; }
    .build-row .num { font-size: 12.5px; color: #444; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .build-row .is-empty { color: #ccc; }
    .mc-len { width: 62px; font-size: 13px !important; padding: 3px 5px !important; text-align: right; font-variant-numeric: tabular-nums; }

    .btn {
      font-family: inherit;
      font-size: 13px;
      padding: 5px 10px;
      border: 1px solid #999;
      border-radius: 6px;
      background: #fff;
      color: #111;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: #eee; }
    .btn:disabled { color: #bbb; cursor: default; }
    .btn.primary { background: #06c; border-color: #06c; color: #fff; font-weight: bold; }
    .btn.primary:hover:not(:disabled) { background: #058; }
    .btn.small { padding: 3px 8px; }

    #empty-msg { color: #999; font-size: 13px; padding: 14px 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    #copy-msg { font-size: 12px; color: #1a7f37; }

    /* ---------- 楽曲リスト ---------- */
    #lib { margin-top: 28px; }
    #search-box { width: 320px; }
    #hint { color: #999; font-size: 12px; margin: 8px 0 0; }

    .list-header, .lib-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 52px 52px 64px;
      column-gap: 10px;
      align-items: center;
    }
    .list-header { margin-top: 12px; padding: 4px 0; border-bottom: 1px solid #ddd; font-size: 11px; color: #999; }
    .h-num, .lib-row .num { text-align: right; padding-right: 8px; }
    #lib-list { margin: 0; padding: 0; list-style: none; }
    .lib-row { padding: 7px 0; border-bottom: 1px solid #eee; }
    .lib-row .nm { font-size: 13px; color: #222; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lib-row .num { font-size: 12.5px; color: #444; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .is-empty { color: #ccc !important; }

    @media (max-width: 639px) {
      .info-grid { grid-template-columns: 1fr; }
      .build-row { grid-template-columns: 22px 26px minmax(0, 1fr) auto; row-gap: 4px; }
      .build-row .meta-line { grid-column: 3; display: flex; gap: 14px; align-items: center; }
      .build-row .ctrl { grid-column: 4; grid-row: 1; }
      .list-header { display: none; }
      .lib-row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 3px; }
      .lib-row .meta-line { grid-column: 1; display: flex; gap: 14px; }
      .lib-row .add-cell { grid-column: 2; grid-row: 1 / span 2; }
      .num { text-align: left !important; padding-right: 0 !important; }
    }
    @media (min-width: 640px) {
      .meta-line { display: contents; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <div id="page-nav">
    <a href="setlist.html">セトリ検索</a>
    <a href="analysis.html">集計・分析</a>
    <a href="songs.html">楽曲データ</a>
    <span class="current" aria-current="page">セトリ作成</span>
  </div>
  <h1>笹川真生 セトリ作成</h1>

  <section id="maker">
    <h2>セットリストを作る</h2>
    <div class="info-grid">
      <div><label for="f-date">日付</label><input type="date" id="f-date"></div>
      <div><label for="f-limit">持ち時間（分）</label><input type="number" id="f-limit" min="0" step="1" inputmode="numeric" value="30"></div>
      <div><label for="f-venue">会場</label><input type="text" id="f-venue" placeholder="日産スタジアム"></div>
      <div><label for="f-event">公演名</label><input type="text" id="f-event"></div>
      <div class="full"><label for="f-memo">メモ</label><input type="text" id="f-memo"></div>
    </div>

    <div id="summary"></div>
    <ol id="build-list"></ol>
    <div id="empty-msg">下の楽曲リストから「追加」を押すと、ここに入ります。左の ≡ をドラッグすると並べ替えできます。</div>

    <div class="actions">
      <button class="btn primary" id="btn-copy" type="button">テキストにしてコピー</button>
      <button class="btn" id="btn-mc" type="button">＋ MCを追加</button>
      <button class="btn" id="btn-clear" type="button">曲をすべて外す</button>
      <span id="copy-msg"></span>
    </div>
  </section>

  <section id="lib">
    <h2>楽曲リスト</h2>
    <input type="text" id="search-box" placeholder="曲名で検索..." autocomplete="off">
    <p id="hint"></p>
    <div class="list-header">
      <span>曲名</span>
      <span class="h-num">時間</span>
      <span class="h-num">BPM</span>
      <span></span>
    </div>
    <ul id="lib-list"></ul>
  </section>

</div>

  <script src="setlist-data.js"></script>
  <script src="song-meta.js"></script>
  <script>
    const STORAGE_KEY = "setlist-maker-draft-v1";
    const EMPTY_META = { bpm: "", length: "", release: "", album: "", track: "", stem: "", provided: "", alt: [] };

    const $ = id => document.getElementById(id);
    const fields = { date: $("f-date"), limit: $("f-limit"), venue: $("f-venue"), event: $("f-event"), memo: $("f-memo") };

    // 今までやった全曲と演奏回数
    const plays = new Map();
    performances.forEach(perf => perf.setlist.forEach(raw => {
      const song = normalize(raw);
      plays.set(song, (plays.get(song) || 0) + 1);
    }));
    const allSongs = Array.from(plays.keys());

    // 作成中のセトリ。曲は { type: "song", name }、MCは { type: "mc", sec }
    let picked = [];
    const DEFAULT_MC_SEC = 120;

    function getMeta(song) { return Object.assign({}, EMPTY_META, songMeta[song]); }
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // "3:11" → 191秒。読めなければ null
    function parseLength(str) {
      const m = /^(\d+):([0-5]?\d)$/.exec(String(str).trim());
      return m ? Number(m[1]) * 60 + Number(m[2]) : null;
    }
    // MCの入力: "1:30" または分の数字 ("2", "1.5")
    function parseDuration(str) {
      const t = String(str).trim().replace("：", ":");
      const sec = parseLength(t);
      if (sec !== null) return sec;
      if (/^\d+(\.\d+)?$/.test(t)) return Math.round(parseFloat(t) * 60);
      return null;
    }
    function fmt(sec) {
      const s = Math.abs(Math.round(sec));
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }
    // 曲の「いま選んでいるバージョン」の長さ・BPM・名前（ver=0 が通常、1以降がライブアレンジ）
    function effective(item) {
      const m = getMeta(item.name);
      const alt = item.ver > 0 ? m.alt[item.ver - 1] : null;
      return {
        length: alt && alt.length ? alt.length : m.length,
        bpm: alt && alt.bpm ? alt.bpm : m.bpm,
        label: alt ? alt.label : "",
      };
    }
    function secOf(item) {
      return item.type === "mc" ? item.sec : parseLength(effective(item).length);
    }

    // リリース日の新しい順 → 同じアルバムは曲順どおりにまとめる。
    // 楽曲提供曲は提供先ごとにまとめて、その後ろ。未入力の曲は最後。
    function orderSongs(songs) {
      const groups = new Map();
      const provided = new Map();
      const unset = [];

      songs.forEach(song => {
        const m = getMeta(song);
        if (m.provided) {
          if (!provided.has(m.provided)) provided.set(m.provided, []);
          provided.get(m.provided).push(song);
          return;
        }
        if (!m.release && !m.album) { unset.push(song); return; }
        const key = m.album ? "a:" + m.album : "s:" + song;
        if (!groups.has(key)) groups.set(key, { key, release: "", album: m.album, songs: [] });
        const g = groups.get(key);
        if (m.release > g.release) g.release = m.release;
        g.songs.push(song);
      });

      const trackOf = s => Number(getMeta(s).track) || Infinity;
      const sortedGroups = Array.from(groups.values()).sort((a, b) =>
        b.release.localeCompare(a.release) || a.album.localeCompare(b.album, "ja"));

      const out = [];
      sortedGroups.forEach(g => {
        g.songs.sort((a, b) => trackOf(a) - trackOf(b) || a.localeCompare(b, "ja"));
        g.songs.forEach((song, i) => out.push({ song, groupStart: i === 0 && out.length > 0 }));
      });

      Array.from(provided.keys()).sort((a, b) => a.localeCompare(b, "ja")).forEach(artist => {
        const list = provided.get(artist);
        list.sort((a, b) => getMeta(b).release.localeCompare(getMeta(a).release) || a.localeCompare(b, "ja"));
        list.forEach((song, i) => out.push({ song, header: i === 0 ? "楽曲提供曲｜" + artist : "" }));
      });

      unset.sort((a, b) => plays.get(b) - plays.get(a) || a.localeCompare(b, "ja"));
      unset.forEach((song, i) => out.push({ song, header: i === 0 ? "リリース日・アルバム未入力" : "" }));
      return out;
    }

    const ordered = orderSongs(allSongs);

    // ---------- 入力内容は保存しない（再読み込み・ページ移動でリセット） ----------
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}   // 旧バージョンの下書きを消す
    function save() {}

    function isDirty() {
      return picked.length > 0 ||
        fields.date.value !== "" || fields.venue.value.trim() !== "" ||
        fields.event.value.trim() !== "" || fields.memo.value.trim() !== "" ||
        fields.limit.value !== fields.limit.defaultValue;
    }
    window.addEventListener("beforeunload", e => {
      if (!isDirty()) return;
      e.preventDefault();
      e.returnValue = "";   // ブラウザ標準の「変更が失われます」警告を出す
    });

    // ---------- 作成ゾーン ----------
    const buildList = $("build-list");

    function renderBuild() {
      buildList.innerHTML = "";
      $("empty-msg").style.display = picked.length ? "none" : "block";

      let songNo = 0;
      picked.forEach((item, i) => {
        const li = document.createElement("li");
        li.dataset.i = i;
        if (item.type === "mc") {
          li.className = "build-row mc";
          li.innerHTML = `
            <span class="grip" title="ドラッグで並べ替え">≡</span>
            <span class="no"></span>
            <span class="nm">MC</span>
            <span class="meta-line">
              <input type="text" class="mc-len" value="${fmt(item.sec)}" inputmode="text" aria-label="MCの長さ（分:秒）">
              <span class="num is-empty"></span>
            </span>
            <span class="ctrl"><button class="btn small" type="button" data-act="del" aria-label="外す">✕</button></span>`;
        } else {
          const m = getMeta(item.name);
          const eff = effective(item);
          const sec = parseLength(eff.length);
          const verSelect = m.alt.length
            ? `<select class="ver" aria-label="バージョン">` +
              [{ label: "通常", length: m.length }].concat(m.alt).map((v, k) =>
                `<option value="${k}"${k === item.ver ? " selected" : ""}>${escapeHtml(v.label)}${v.length ? " " + escapeHtml(v.length) : ""}</option>`).join("") +
              `</select>`
            : "";
          songNo++;
          li.className = "build-row";
          li.innerHTML = `
            <span class="grip" title="ドラッグで並べ替え">≡</span>
            <span class="no">${songNo}</span>
            <span class="nmwrap"><span class="nm" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span>${verSelect}</span>
            <span class="meta-line">
              <span class="num${sec === null ? " is-empty" : ""}">${sec === null ? "—" : fmt(sec)}</span>
              <span class="num${eff.bpm === "" ? " is-empty" : ""}">${eff.bpm === "" ? "—" : escapeHtml(eff.bpm)}</span>
            </span>
            <span class="ctrl"><button class="btn small" type="button" data-act="del" aria-label="外す">✕</button></span>`;
        }
        buildList.appendChild(li);
      });
      renderSummary();
    }

    function renderSummary() {
      let total = 0, unknown = 0, songs = 0, mcs = 0;
      picked.forEach(it => {
        if (it.type === "mc") mcs++; else songs++;
        const sec = secOf(it);
        if (sec === null) unknown++; else total += sec;
      });
      const limitMin = parseFloat(fields.limit.value);
      let html = `<span>${songs} 曲${mcs ? ` ＋ MC ${mcs}` : ""}</span><span>合計 <span class="total">${fmt(total)}</span></span>`;
      if (limitMin > 0) {
        const diff = limitMin * 60 - total;
        html += diff >= 0
          ? `<span class="ok">持ち時間まで残り ${fmt(diff)}</span>`
          : `<span class="over">${fmt(diff)} オーバー</span>`;
        html += `<span>（持ち時間 ${limitMin}分）</span>`;
      }
      if (unknown) html += `<span class="warn">※ 長さ未入力の曲が ${unknown} 曲あります（合計に含まれません）</span>`;
      $("summary").innerHTML = html;
    }

    buildList.addEventListener("click", e => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      picked.splice(Number(btn.closest(".build-row").dataset.i), 1);
      save(); renderAll();
    });

    // ライブアレンジの切り替え
    buildList.addEventListener("change", e => {
      if (!e.target.classList.contains("ver")) return;
      picked[Number(e.target.closest(".build-row").dataset.i)].ver = Number(e.target.value);
      renderBuild();
    });

    // MCの長さ編集
    buildList.addEventListener("input", e => {
      if (!e.target.classList.contains("mc-len")) return;
      const sec = parseDuration(e.target.value);
      if (sec === null) return;
      picked[Number(e.target.closest(".build-row").dataset.i)].sec = sec;
      save(); renderSummary();
    });
    buildList.addEventListener("focusout", e => {
      if (!e.target.classList.contains("mc-len")) return;
      const item = picked[Number(e.target.closest(".build-row").dataset.i)];
      e.target.value = fmt(item.sec);
    });

    // ドラッグ＆ドロップで並べ替え（マウス・タッチ両対応）
    let drag = null;
    buildList.addEventListener("pointerdown", e => {
      const grip = e.target.closest(".grip");
      if (!grip) return;
      e.preventDefault();
      const row = grip.closest(".build-row");
      drag = { row, pointerId: e.pointerId };
      row.classList.add("dragging");
      grip.setPointerCapture(e.pointerId);
    });
    buildList.addEventListener("pointermove", e => {
      if (!drag) return;
      const rows = Array.from(buildList.children).filter(r => r !== drag.row);
      const before = rows.find(r => {
        const rect = r.getBoundingClientRect();
        return e.clientY < rect.top + rect.height / 2;
      });
      if (before) {
        if (drag.row.nextElementSibling !== before) buildList.insertBefore(drag.row, before);
      } else if (buildList.lastElementChild !== drag.row) {
        buildList.appendChild(drag.row);
      }
    });
    function endDrag() {
      if (!drag) return;
      const order = Array.from(buildList.children).map(r => Number(r.dataset.i));
      drag = null;
      picked = order.map(i => picked[i]);
      save(); renderBuild();
    }
    buildList.addEventListener("pointerup", endDrag);
    buildList.addEventListener("pointercancel", endDrag);

    $("btn-mc").addEventListener("click", () => {
      picked.push({ type: "mc", sec: DEFAULT_MC_SEC });
      save(); renderBuild();
      const inputs = buildList.querySelectorAll(".mc-len");
      const last = inputs[inputs.length - 1];
      if (last) { last.focus(); last.select(); }
    });

    $("btn-clear").addEventListener("click", () => {
      if (!picked.length) return;
      if (!confirm("作成中の曲・MCをすべて外しますか？")) return;
      picked = []; save(); renderAll();
    });

    $("btn-copy").addEventListener("click", async () => {
      const lines = [];
      const head = [fields.date.value.replace(/-/g, "."), fields.event.value.trim()].filter(Boolean).join(" / ");
      if (head) lines.push(head);
      if (fields.venue.value.trim()) lines.push(fields.venue.value.trim());
      const lim = parseFloat(fields.limit.value);
      if (lim > 0) lines.push(`持ち時間 ${lim}分`);
      if (lines.length) lines.push("");
      let n = 0, total = 0;
      picked.forEach(it => {
        if (it.type === "mc") lines.push(`MC（${fmt(it.sec)}）`);
        else {
          const lab = effective(it).label;
          lines.push(`${++n}. ${it.name}${lab ? `（${lab}）` : ""}`);
        }
        const sec = secOf(it);
        if (sec !== null) total += sec;
      });
      lines.push("", `合計 ${fmt(total)}`);
      if (fields.memo.value.trim()) lines.push("", fields.memo.value.trim());
      const msg = $("copy-msg");
      try {
        await navigator.clipboard.writeText(lines.join("\n"));
        msg.textContent = "コピーしました";
      } catch (e) {
        msg.textContent = "コピーできませんでした";
      }
      setTimeout(() => { msg.textContent = ""; }, 2500);
    });

    Object.values(fields).forEach(el => el.addEventListener("input", () => { save(); renderSummary(); }));

    // ---------- 楽曲リスト ----------
    function renderLib() {
      const q = $("search-box").value.trim().toLowerCase();
      let section = "", shown = "", count = 0;
      const ul = $("lib-list");
      ul.innerHTML = "";

      ordered.forEach(item => {
        if (item.header) section = item.header;
        const song = item.song;
        if (q !== "" && !song.toLowerCase().includes(q)) return;
        count++;

        if (section && section !== shown) {
          const h = document.createElement("li");
          h.className = "section-header";
          h.textContent = section;
          ul.appendChild(h);
          shown = section;
        }

        const m = getMeta(song);
        const added = picked.some(x => x.type === "song" && x.name === song);
        const badge = m.alt.length ? `<span class="alt-badge">ライブver.あり</span>` : "";
        const altNote = m.alt.length
          ? `<span class="alt-note">ライブアレンジ：${m.alt.map(a => `${escapeHtml(a.label)} ${escapeHtml(a.length)}${a.bpm ? ` / BPM ${escapeHtml(a.bpm)}` : ""}`).join("、")}</span>`
          : "";
        const li = document.createElement("li");
        li.className = "lib-row";
        li.innerHTML = `
          <span class="namecell"><span class="nm" title="${escapeHtml(song)}">${escapeHtml(song)}${badge}</span>${altNote}</span>
          <span class="meta-line">
            <span class="num${m.length ? "" : " is-empty"}">${m.length ? escapeHtml(m.length) : "—"}</span>
            <span class="num${m.bpm === "" ? " is-empty" : ""}">${m.bpm === "" ? "—" : escapeHtml(m.bpm)}</span>
          </span>
          <span class="add-cell"><button class="btn small" type="button" data-song="${escapeHtml(song)}" ${added ? "disabled" : ""}>${added ? "追加済" : "追加"}</button></span>`;
        ul.appendChild(li);
      });
      $("hint").textContent = `${count} 曲を表示中（全 ${allSongs.length} 曲）`;
    }

    $("lib-list").addEventListener("click", e => {
      const btn = e.target.closest("button[data-song]");
      if (!btn || btn.disabled) return;
      picked.push({ type: "song", name: btn.dataset.song, ver: 0 });
      save(); renderAll();
    });
    $("search-box").addEventListener("input", renderLib);

    function renderAll() { renderBuild(); renderLib(); }
    renderAll();
  </script>

</body>
</html>
